    ["ड्यूस (Deuce): 40-40 पर लगातार 2 पॉइंट जीतने ज़रूरी — पहले एडवांटेज (Advantage), फिर गेम।","Deuce: at 40-40 you must win two points in a row — first advantage, then game."],
    ["सेट: जो पहले 6 गेम जीते, 2 गेम की बढ़त के साथ; 6-6 पर टाई-ब्रेक।","Set: first to 6 games with a 2-game lead; at 6-6 a tie-break is played."],
    ["टाई-ब्रेक: पहले 7 पॉइंट, 2 पॉइंट की बढ़त के साथ।","Tie-break: first to 7 points with a 2-point lead."],
    ["मैच ज़्यादातर बेस्ट ऑफ़ 3 सेट; पुरुषों के ग्रैंड स्लैम बेस्ट ऑफ़ 5। ग्रैंड स्लैम के आख़िरी सेट में 6-6 पर 10 पॉइंट का टाई-ब्रेक।","Most matches are best of 3 sets; men's Grand Slams are best of 5. In a Grand Slam final set, 6-6 goes to a 10-point tie-break."]]},
  {t:["सर्विस","Service"], r:[
    ["सर्वर बेसलाइन के पीछे, सेंटर मार्क और साइडलाइन के बीच खड़ा होकर तिरछे सर्विस बॉक्स में सर्विस करता है।","The server stands behind the baseline, between the centre mark and the sideline, and serves diagonally into the service box."],
    ["दो मौके मिलते हैं; दोनों चूके तो डबल फ़ॉल्ट (Double Fault) और पॉइंट गया।","You get two attempts; missing both is a double fault and loses the point."],
    ["सर्विस नेट छूकर सही बॉक्स में गिरे तो लेट (Let) — दोबारा सर्विस।","A serve that clips the net and lands in the correct box is a let and is replayed."],
    ["फ़ुट फ़ॉल्ट: बॉल मारने से पहले बेसलाइन या कोर्ट पर पैर रखना।","Foot fault: touching the baseline or the court with a foot before hitting the ball."],
    ["हर पॉइंट पर सर्वर साइड बदलता है (पहला पॉइंट दाईं तरफ़ से); हर गेम के बाद सर्विस दूसरे खिलाड़ी के पास।","The server alternates sides each point, starting from the right; the serve passes to the other player after each game."]]},
  {t:["खेल के दौरान","During Play"], r:[
    ["बॉल अपनी तरफ़ सिर्फ़ एक बार टप्पा खा सकती है; बिना टप्पे के मारना (volley) ठीक है, पर सर्विस का रिटर्न टप्पे के बाद ही।","The ball may bounce only once on your side; volleys are allowed, but the return of serve must bounce first."],
    ["लाइन के किसी भी हिस्से को छूने वाली बॉल अंदर (IN) है।","A ball touching any part of the line is in."],
    ["पॉइंट गँवाते हैं: बॉल शरीर से लगे, खेल के दौरान नेट छुएँ, या बॉल के नेट पार करने से पहले मारें।","You lose the point if the ball hits you, if you touch the net during play, or if you hit the ball before it crosses the net."],
    ["सेट के पहले गेम और फिर हर विषम (odd) गेम के बाद साइड बदलती है; टाई-ब्रेक में हर 6 पॉइंट पर।","Players change ends after the first game and every odd game of a set; in a tie-break, every 6 points."]]},
  {t:["रिव्यू और आचरण","Reviews & Conduct"], r:[
    ["कई टूर्नामेंट में इलेक्ट्रॉनिक लाइन कॉलिंग (Hawk-Eye) होती है; जहाँ चैलेंज सिस्टम है वहाँ खिलाड़ी कॉल पर चैलेंज कर सकते हैं।","Many tournaments use electronic line calling (Hawk-Eye); where a challenge system is used, players can challenge calls."],
    ["पॉइंट्स के बीच 25 सेकंड का शॉट क्लॉक।","There is a 25-second shot clock between points."],
    ["आचरण उल्लंघन (code violation) पर क्रम से: चेतावनी, पॉइंट पेनल्टी, गेम पेनल्टी।","Code violations escalate: warning, then point penalty, then game penalty."]]}
  ]},

{ id:"carrom", name:["कैरम","Carrom"], icon:"🪙", c:"#854d0e",
  body:["ICF (International Carrom Federation) · AICF","ICF (International Carrom Federation) · AICF"],
  facts:[[["खिलाड़ी","Players"],["2 या 4","2 or 4"]],[["गोटियाँ","Coins"],["9 सफ़ेद · 9 काली · 1 क्वीन","9 white · 9 black · 1 queen"]],[["बोर्ड","Board"],["74 सेमी खेलने की सतह","74 cm playing surface"]],[["गेम","Game"],["25 पॉइंट या 8 बोर्ड","25 pts or 8 boards"]]],
  sections:[
  {t:["बुनियादी नियम","Basics"], r:[
    ["2 खिलाड़ी (सिंगल्स) या 4 (डबल्स — पार्टनर आमने-सामने)।","Played by 2 (singles) or 4 (doubles, with partners sitting opposite)."],
    ["9 सफ़ेद, 9 काली गोटियाँ और 1 लाल क्वीन। पहला शॉट (ब्रेक) मारने वाला सफ़ेद गोटियों से खेलता है।","There are 9 white coins, 9 black coins and 1 red queen. The player who breaks plays white."],
    ["स्ट्राइकर अपनी बेसलाइन के अंदर रखा जाता है, दोनों लाइनों को छूते हुए।","The striker is placed within the player's baseline, touching both lines."],
    ["स्ट्राइकर उंगली से फ़्लिक करके मारा जाता है; बेस से हाथ या शरीर आगे निकालकर नहीं खेल सकते।","The striker is flicked with a finger; you may not reach forward of your base with hand or body to play."]]},
  {t:["गोटी डालना और क्वीन","Pocketing & the Queen"], r:[
    ["अपनी गोटी पॉकेट में डाली तो अगला शॉट भी आपका।","Pocket one of your own coins and you get another turn."],
    ["क्वीन डालने के बाद उसे 'कवर' करना ज़रूरी — उसी या अगले शॉट में अपनी एक गोटी डालें। कवर नहीं हुई तो क्वीन वापस बीच में।","After pocketing the queen you must 'cover' it by pocketing one of your own coins on the same or next shot. If not covered, the queen returns to the centre."],
    ["अपनी आख़िरी गोटी क्वीन कवर होने से पहले डाल दी तो वो बोर्ड हार जाते हैं।","If you pocket your last coin before the queen has been covered, you lose the board."],
    ["विरोधी की गोटी डाल दी तो वो पॉकेट में ही रहती है (उसकी गिनी जाती है) और आपकी बारी ख़त्म।","Pocketing an opponent's coin leaves it pocketed (it counts for them) and ends your turn."]]},
  {t:["फ़ाउल और ड्यू","Fouls & Dues"], r:[
    ["स्ट्राइकर पॉकेट में गया तो फ़ाउल: बारी गई और आपकी डाली हुई एक गोटी वापस बीच में (ड्यू/penalty)।","Pocketing the striker is a foul: you lose your turn and one of your pocketed coins goes back to the centre as a penalty (due)."],
    ["अगर अभी कोई गोटी डाली ही नहीं, तो ये 'ड्यू' बाकी रहता है और अगली गोटी डालते ही चुकाना होता है।","If you haven't pocketed a coin yet, the penalty stays owed (a 'due') and is paid back as soon as you pocket one."],
    ["स्ट्राइकर या गोटी बोर्ड से बाहर जाना, या हाथ से गोटी छूना/हिलाना भी फ़ाउल है।","Knocking the striker or a coin off the board, or touching or moving coins with your hand, is also a foul."]]},
  {t:["स्कोरिंग","Scoring"], r:[
    ["जो पहले अपनी सारी गोटियाँ डाल दे, वो बोर्ड जीतता है।","Whoever pockets all their own coins first wins the board."],
    ["बोर्ड जीतने वाले को विरोधी की बची हुई हर गोटी पर 1 पॉइंट, और क्वीन कवर की हो तो 3 पॉइंट और।","The board winner scores 1 point for each opponent coin left on the board, plus 3 points if they covered the queen."],
    ["गेम: जो पहले 25 पॉइंट तक पहुँचे, या 8 बोर्ड के बाद जिसके ज़्यादा पॉइंट (ICF नियम)।","Game: first to 25 points, or the higher score after 8 boards (ICF rules)."],
    ["ICF नियमों में खिलाड़ी के 22 पॉइंट हो जाने के बाद क्वीन के पॉइंट नहीं जुड़ते।","Under ICF rules, once a player reaches 22 points, the queen no longer adds points."]]}
  ]}
,

{ id:"wrestling", name:["कुश्ती","Wrestling"], icon:"🤼‍♂️", c:"#9d174d",
  body:["UWW · WFI (Wrestling Federation of India)","UWW · WFI (Wrestling Federation of India)"],
  facts:[[["स्टाइल","Styles"],["फ़्रीस्टाइल · ग्रीको-रोमन","Freestyle · Greco-Roman"]],[["समय","Duration"],["2 × 3 मिनट","2 × 3 min"]],[["मैट","Mat"],["9 मी का घेरा","9 m circle"]],[["तुरंत जीत","Instant win"],["फ़ॉल (पिन)","Fall (pin)"]]],
  sections:[
  {t:["बुनियादी नियम","Basics"], r:[
    ["मुक़ाबला 3-3 मिनट के 2 पीरियड का, बीच में 30 सेकंड का ब्रेक।","A bout has two 3-minute periods with a 30-second break."],
    ["पहलवान वज़न वर्ग (weight category) के हिसाब से लड़ते हैं; हर दिन सुबह वज़न (weigh-in) होता है।","Wrestlers compete in weight categories, with a weigh-in on the morning of competition."],
    ["फ़्रीस्टाइल में पूरे शरीर (पैरों सहित) पर पकड़ ली जा सकती है; ग्रीको-रोमन में कमर के नीचे पकड़ना या पैरों से अटैक मना है।","In freestyle you may attack the whole body including the legs; in Greco-Roman, holds below the waist and attacking with the legs are banned."],
    ["एक पहलवान लाल और दूसरा नीली सिंगलेट पहनता है।","One wrestler wears red, the other blue."]]},
  {t:["जीत के तरीके","Ways to Win"], r:[
    ["फ़ॉल (Fall / चित): विरोधी के दोनों कंधे एक साथ मैट पर दबा देना — मुक़ाबला वहीं ख़त्म।","Fall (pin): holding both of the opponent's shoulders on the mat at the same time ends the bout at once."],
    ["टेक्निकल सुपीरियोरिटी: फ़्रीस्टाइल में 10 पॉइंट और ग्रीको-रोमन में 8 पॉइंट की बढ़त होते ही जीत।","Technical superiority: a 10-point lead in freestyle, or 8 in Greco-Roman, ends the bout."],
    ["पॉइंट्स पर जीत: समय ख़त्म होने पर ज़्यादा पॉइंट वाला जीतता है।","Win on points: the wrestler with more points when time runs out wins."],
    ["पॉइंट बराबर हों तो: ज़्यादा क़ीमत वाला दाँव (बड़ा मूव), फिर कम चेतावनी (cautions), फिर आख़िरी पॉइंट किसने लिया — इस क्रम से फ़ैसला।","If points are level: the higher-value move wins, then fewer cautions, then whoever scored the last point."],
    ["चोट, अयोग्यता (disqualification) या विरोधी के न आने पर भी जीत मिलती है।","A bout can also be won by injury, disqualification or the opponent's forfeit."]]},
  {t:["पॉइंट","Scoring"], r:[
    ["टेकडाउन (Takedown): विरोधी को गिराकर उसके ऊपर नियंत्रण = 2 पॉइंट; सीधे ख़तरे की स्थिति (danger position) में गिराया तो 4।","Takedown: bringing the opponent down and controlling them = 2 points; straight into the danger position = 4."],
    ["एक्सपोज़र (Exposure): विरोधी की पीठ को मैट की तरफ़ घुमाना, जैसे गट-रेंच = 2 पॉइंट।","Exposure: turning the opponent's back towards the mat, such as with a gut-wrench = 2 points."],
    ["पुश-आउट / स्टेप-आउट: विरोधी का पैर लाल घेरे (protection area) के बाहर चला जाए = 1 पॉइंट।","Push-out / step-out: the opponent puts a foot outside the red zone = 1 point."],
    ["ऊँची उठाकर पटकना (Grand Amplitude): 4 पॉइंट; सीधे ख़तरे की स्थिति में गिरे तो 5।","Grand-amplitude throw: 4 points; 5 if the opponent lands straight in the danger position."]]},
  {t:["पैसिविटी, चेतावनी और चैलेंज","Passivity, Cautions & Challenges"], r:[
    ["पैसिविटी: जो पहलवान अटैक नहीं करता, उसे 30 सेकंड का 'एक्टिविटी क्लॉक' मिलता है; उसमें पॉइंट नहीं आए तो विरोधी को 1 पॉइंट।","Passivity: a wrestler who isn't attacking is put on a 30-second activity clock; if neither scores in that time, the opponent gets 1 point."],
    ["पकड़ से भागना, जानबूझकर मैट से बाहर जाना, या विरोधी की उंगलियाँ मरोड़ना जैसे फ़ाउल पर विरोधी को पॉइंट और चेतावनी।","Fleeing a hold, deliberately leaving the mat, or bending fingers earns the opponent points and the offender a caution."],
    ["एक मुक़ाबले में 3 चेतावनी (cautions) मिलने पर पहलवान अयोग्य (disqualified)।","Three cautions in a bout lead to disqualification."],
    ["कोच फ़ैसले पर चैलेंज ले सकता है (वीडियो रिव्यू); चैलेंज गलत निकला तो विरोधी को 1 पॉइंट।","A coach may challenge a decision for video review; if the challenge fails, the opponent gets 1 point."]]}
  ]},

{ id:"boxing", name:["मुक्केबाज़ी","Boxing"], icon:"🥊", c:"#991b1b",
  body:["World Boxing · BFI (Boxing Federation of India)","World Boxing · BFI (Boxing Federation of India)"],
  facts:[[["राउंड","Rounds"],["3 × 3 मिनट (एमेच्योर)","3 × 3 min (amateur)"]],[["आराम","Rest"],["1 मिनट","1 min"]],[["जज","Judges"],["5","5"]],[["स्कोरिंग","Scoring"],["10-पॉइंट मस्ट","10-point must"]]],
  sections:[
  {t:["बुनियादी नियम","Basics"], r:[
    ["एमेच्योर (ओलंपिक) बॉक्सिंग में 3-3 मिनट के 3 राउंड, बीच में 1 मिनट आराम। प्रोफ़ेशनल बॉक्सिंग में 4 से 12 राउंड।","Amateur (Olympic) bouts have three 3-minute rounds with 1 minute of rest. Professional bouts run 4 to 12 rounds."],
    ["मुक्केबाज़ वज़न वर्ग में लड़ते हैं और मुक़ाबले से पहले वज़न होता है।","Boxers compete in weight classes and weigh in before the bout."],
    ["एलीट पुरुष एमेच्योर मुक्केबाज़ बिना हेडगार्ड लड़ते हैं; महिलाएँ और जूनियर हेडगार्ड पहनते हैं।","Elite men's amateur boxing is fought without headguards; women and juniors wear them."],
    ["एक कोना लाल और एक नीला होता है; रेफ़री रिंग में होता है और 5 जज स्कोर करते हैं।","One corner is red and one blue; a referee controls the ring and 5 judges score."]]},
  {t:["स्कोरिंग","Scoring"], r:[
    ["पॉइंट सिर्फ़ साफ़ मुक्कों पर — बंद दस्ताने के नकल वाले हिस्से से, सिर या शरीर के आगे/बगल में, बेल्ट के ऊपर।","Only clean punches score — with the knuckle part of a closed glove, on the front or sides of the head or body above the belt."],
    ["10-पॉइंट मस्ट सिस्टम: हर जज हर राउंड के विजेता को 10 और हारने वाले को 9 या कम देता है।","10-point must system: each judge gives the round winner 10 and the loser 9 or fewer."],
    ["जज साफ़ मुक्कों की संख्या, मुक़ाबले पर दबदबा, तकनीक और रणनीति, और नियमों के पालन को देखते हैं।","Judges look at the number of quality blows, domination of the bout, technique and tactics, and rule-breaking."],
    ["फ़ैसला: सर्वसम्मति (unanimous) — सारे जज एक तरफ़; विभाजित (split) — बहुमत से।","Decisions are unanimous (all judges agree) or split (by majority)."]]},
  {t:["जीत के तरीके","Ways to Win"], r:[
    ["नॉकआउट (KO): गिरा हुआ मुक्केबाज़ 10 की गिनती तक खड़ा होकर लड़ने को तैयार न हो।","Knockout (KO): a boxer who goes down can't get up and continue before the count of 10."],
    ["RSC (Referee Stops Contest): रेफ़री को लगे कि एक मुक्केबाज़ बहुत पिछड़ रहा है या आगे लड़ना ख़तरनाक है।","RSC (Referee Stops Contest): the referee stops the bout because a boxer is outclassed or can't safely continue."],
    ["स्टैंडिंग काउंट: एमेच्योर बॉक्सिंग में ज़ोरदार मुक्का खाए मुक्केबाज़ को रेफ़री खड़े-खड़े 8 तक गिनती दे सकता है।","Standing count: in amateur boxing the referee can give a boxer who's badly hurt a count of 8 while standing."],
    ["अयोग्यता (DSQ) — बार-बार या गंभीर फ़ाउल पर; या कोना तौलिया फेंककर हार मान ले।","Disqualification (DSQ) for repeated or serious fouls; or the corner can retire their boxer."]]},
  {t:["फ़ाउल","Fouls"], r:[
    ["बेल्ट के नीचे मारना, सिर के पीछे या गर्दन पर मारना (rabbit punch), खुले दस्ताने से मारना।","Hitting below the belt, on the back of the head or neck (rabbit punch), or with an open glove."],
    ["सिर से टक्कर मारना (head butt), कोहनी या कंधे का इस्तेमाल।","Head-butting, or using the elbow or shoulder."],
    ["विरोधी को पकड़कर रखना (holding), दबाना, या 'Break' कहने के बाद मारना।","Holding or clinching the opponent, or hitting after the referee calls 'Break'."],
    ["गिरे हुए मुक्केबाज़ को मारना।","Hitting an opponent who is down."],
    ["फ़ाउल पर रेफ़री चेतावनी (caution), फिर औपचारिक चेतावनी (warning) देता है; warning पर जज पॉइंट काट सकते हैं।","For fouls the referee gives a caution, then an official warning; warnings can cost points on the judges' cards."]]}
  ]},

{ id:"archery", name:["तीरंदाज़ी","Archery"], icon:"🏹", c:"#d97706",
  body:["World Archery · AAI (Archery Association of India)","World Archery · AAI (Archery Association of India)"],
  facts:[[["रिकर्व दूरी","Recurve distance"],["70 मी","70 m"]],[["कंपाउंड दूरी","Compound distance"],["50 मी","50 m"]],[["टारगेट","Target"],["10 रिंग · 1–10 पॉइंट","10 rings · 1–10 pts"]],[["सेट जीत","Set win"],["6 सेट पॉइंट","6 set points"]]],
  sections:[
  {t:["बुनियादी नियम","Basics"], r:[
    ["रिकर्व (ओलंपिक धनुष): 70 मी दूरी, 122 सेमी का टारगेट।","Recurve (the Olympic bow): shot at 70 m on a 122 cm target face."],
    ["कंपाउंड (पुली वाला धनुष): 50 मी दूरी, 80 सेमी का टारगेट जिसमें 10 का घेरा छोटा होता है।","Compound (the pulley bow): shot at 50 m on an 80 cm target with a smaller 10 ring."],
    ["टारगेट में 10 रिंग: बाहर से अंदर 1 से 10 पॉइंट। बीच का सबसे छोटा घेरा 'X' (इनर टेन) — बराबरी तोड़ने में काम आता है।","The target has 10 rings scoring 1 to 10 from outside in. The innermost ring, the 'X' (inner ten), is used to break ties."],
    ["तीर दो रिंग के बीच की लाइन को छुए तो ज़्यादा वाला स्कोर मिलता है।","An arrow touching the line between two rings scores the higher value."],
    ["तीरंदाज़ अपने तीर तभी निकालते हैं जब सब निशाना लगा चुके हों और जज स्कोर लिख लें।","Arrows are only pulled after everyone has shot and the scores have been recorded."]]},
  {t:["रिकर्व मैच — सेट सिस्टम","Recurve Matches — Set System"], r:[
    ["हर सेट में हर तीरंदाज़ 3 तीर चलाता है; ज़्यादा कुल स्कोर वाले को 2 सेट पॉइंट, बराबरी पर दोनों को 1।","Each set is 3 arrows per archer; the higher total earns 2 set points, a tie gives 1 each."],
    ["जो पहले 6 सेट पॉइंट तक पहुँचे, वो मैच जीतता है।","The first archer to 6 set points wins the match."],
    ["5 सेट के बाद 5-5 हो तो शूट-ऑफ़: एक-एक तीर, जिसका तीर केंद्र के ज़्यादा पास वो जीता।","At 5-5 after five sets there's a shoot-off: one arrow each, closest to the centre wins."],
    ["व्यक्तिगत मैच में तीरंदाज़ बारी-बारी चलाते हैं, हर तीर के लिए 20 सेकंड।","In individual matches archers shoot alternately, with 20 seconds per arrow."]]},
  {t:["कंपाउंड मैच","Compound Matches"], r:[
    ["कंपाउंड में सेट सिस्टम नहीं — 3-3 तीरों के 5 राउंड (ends) का कुल स्कोर, अधिकतम 150।","Compound uses no set system — the total of five ends of 3 arrows counts, out of 150."],
    ["कुल स्कोर बराबर हो तो एक तीर का शूट-ऑफ़।","A tied total goes to a one-arrow shoot-off."]]},
  {t:["उपकरण और सुरक्षा","Equipment & Safety"], r:[
    ["रिकर्व धनुष पर साइट (निशाना लगाने का यंत्र) लग सकता है, पर मैग्नीफ़ाइंग लेंस नहीं; कंपाउंड पर लेंस वाला स्कोप चल सकता है।","A recurve bow may have a sight but no magnifying lens; a compound bow may use a magnifying scope."],
    ["शूटिंग लाइन पर सिग्नल (सीटी/लाइट) मिलने पर ही तीर चढ़ाना; समय ख़त्म होने के बाद चलाया तीर गिना नहीं जाता।","Only nock and shoot on the start signal; an arrow shot after time expires doesn't count (the archer loses their best arrow of the end)."],
    ["कोई भी अगर टारगेट की ओर जा रहा हो तो तुरंत शूटिंग रुकती है।","Shooting stops immediately if anyone is near the targets."]]}
  ]},

{ id:"snooker", name:["स्नूकर","Snooker"], icon:"🎱", c:"#047857",
  body:["WPBSA · World Snooker Tour · BSFI","WPBSA · World Snooker Tour · BSFI"],
  facts:[[["खिलाड़ी","Players"],["2","2"]],[["गेंदें","Balls"],["15 लाल + 6 रंगीन + सफ़ेद","15 reds + 6 colours + cue ball"]],[["अधिकतम ब्रेक","Max break"],["147","147"]],[["कम से कम फ़ाउल","Min foul"],["4 पॉइंट","4 points"]]],
  sections:[
  {t:["गेंदें और पॉइंट","Balls & Values"], r:[
    ["लाल = 1, पीली = 2, हरी = 3, भूरी = 4, नीली = 5, गुलाबी = 6, काली = 7 पॉइंट।","Red = 1, yellow = 2, green = 3, brown = 4, blue = 5, pink = 6, black = 7 points."],
    ["सफ़ेद गेंद (cue ball) से ही मारना होता है; यही बाकी गेंदों को पॉकेट में भेजती है।","Only the white cue ball is struck; it is used to pot the others."]]},
  {t:["खेल का क्रम","Order of Play"], r:[
    ["पहले एक लाल पॉकेट करनी होती है, फिर कोई एक रंगीन गेंद, फिर लाल, फिर रंगीन — बारी-बारी।","You must pot a red first, then any colour, then a red, then a colour, alternately."],
    ["लाल गेंदें बची हों तब तक पॉकेट हुई रंगीन गेंद वापस अपनी जगह (spot) पर रखी जाती है।","While reds remain, a potted colour is put back on its spot."],
    ["सारी लाल ख़त्म होने के बाद रंगीन गेंदें बढ़ते क्रम में: पीली, हरी, भूरी, नीली, गुलाबी, काली।","Once the reds are gone, the colours are potted in order: yellow, green, brown, blue, pink, black."],
    ["गेंद पॉकेट की तो बारी जारी; चूके तो विरोधी की बारी। एक बारी में बने कुल पॉइंट को 'ब्रेक' कहते हैं।","Pot a ball and you keep playing; miss and it's your opponent's turn. The points scored in one visit are a 'break'."],
    ["मैक्सिमम ब्रेक 147: 15 लाल हर बार काली के साथ (15×8 = 120) और फिर सारे रंग (27)।","The maximum break of 147 is all 15 reds each with the black (15×8 = 120), then all the colours (27)."]]},
  {t:["फ़ाउल","Fouls"], r:[
    ["फ़ाउल पर कम से कम 4 पॉइंट विरोधी को; शामिल गेंद की क़ीमत ज़्यादा हो तो उतने (अधिकतम 7)।","A foul gives the opponent at least 4 points, or the value of the ball involved if higher (up to 7)."],
    ["फ़ाउल: सफ़ेद गेंद का पहले सही गेंद (ball on) से न टकराना, सफ़ेद का पॉकेट में जाना, गलत गेंद पॉकेट करना।","Fouls include missing the ball on with the first contact, potting the cue ball, and potting the wrong ball."],
    ["किसी गेंद को हाथ, कपड़े या क्यू से छूना, जंप शॉट, पुश शॉट, या मारते समय दोनों पैर ज़मीन से उठे होना भी फ़ाउल।","Touching a ball with hand, clothing or cue, a jump shot, a push shot, or having no foot on the floor while striking are also fouls."],
    ["फ़ाउल के बाद विरोधी खुद खेल सकता है या फ़ाउल करने वाले को दोबारा खेलने को कह सकता है।","After a foul the opponent can play on or make the offender play again."],
    ["मिस (Miss): रेफ़री को लगे कि सही गेंद तक पहुँचने की पूरी कोशिश नहीं हुई, तो विरोधी गेंदें वापस रखवाकर दोबारा शॉट करवा सकता है।","Miss: if the referee rules there was no proper attempt to hit the ball on, the opponent can have the balls replaced and the shot replayed."]]},
  {t:["स्नूकर और फ़्रेम","Snookers & Frames"], r:[
    ["स्नूकर (Snooker): सफ़ेद गेंद ऐसी जगह छोड़ना कि विरोधी सीधे सही गेंद तक न मार सके।","Snooker: leaving the cue ball where the opponent can't hit the ball on directly."],
    ["फ़्री बॉल: फ़ाउल के बाद खिलाड़ी स्नूकर हो, तो वो किसी भी गेंद को 'ball on' मानकर खेल सकता है।","Free ball: if a foul leaves you snookered, you may nominate any ball as the ball on."],
    ["एक फ़्रेम में ज़्यादा पॉइंट वाला जीतता है; मैच 'बेस्ट ऑफ़' फ़्रेम (जैसे 9, 19, 35) का होता है।","The player with more points wins the frame; matches are best of a set number of frames (such as 9, 19 or 35)."],
    ["फ़्रेम आख़िर में बराबर रहे तो काली गेंद दोबारा रखी जाती है (re-spotted black) और पहले पॉकेट करने वाला जीतता है।","If a frame ends level, the black is re-spotted and whoever pots it first wins."]]}
  ]},

{ id:"handball", name:["हैंडबॉल","Handball"], icon:"🤾", c:"#2563eb",
  body:["IHF · HFI (Handball Federation of India)","IHF · HFI (Handball Federation of India)"],
  facts:[[["खिलाड़ी","Players"],["7 (GK सहित)","7 (incl. GK)"]],[["समय","Duration"],["2 × 30 मिनट","2 × 30 min"]],[["कोर्ट","Court"],["40 × 20 मी","40 × 20 m"]],[["गोल एरिया","Goal area"],["6 मी","6 m"]]],
  sections:[
  {t:["बुनियादी नियम","Basics"], r:[
    ["हर टीम के 7 खिलाड़ी कोर्ट पर — 6 फ़ील्ड खिलाड़ी और 1 गोलकीपर। सब्स्टिट्यूशन असीमित, अपने सब्स्टिट्यूशन ज़ोन से।","7 players per side — 6 court players and a goalkeeper. Substitutions are unlimited, through your own substitution zone."],
    ["30-30 मिनट के 2 हाफ़, 10 मिनट का ब्रेक।","Two halves of 30 minutes with a 10-minute break."],
    ["बॉल हाथ से खेली जाती है; घुटने के नीचे पैर से छूना मना है (गोलकीपर को छोड़कर)।","The ball is played with the hands; touching it with the leg below the knee isn't allowed (except for the goalkeeper)."],
    ["नॉकआउट मैच बराबर रहे तो 5-5 मिनट के 2 एक्स्ट्रा टाइम, फिर भी बराबर तो 7 मी शूटआउट।","A level knockout match goes to two 5-minute periods of extra time, then a 7-metre shootout."]]},
  {t:["बॉल के साथ","With the Ball"], r:[
    ["बॉल पकड़कर ज़्यादा से ज़्यादा 3 कदम चल सकते हैं।","You may take at most 3 steps while holding the ball."],
    ["बॉल पकड़कर ज़्यादा से ज़्यादा 3 सेकंड रख सकते हैं।","You may hold the ball for at most 3 seconds."],
    ["डबल ड्रिबल मना: ड्रिबल रोककर बॉल पकड़ने के बाद दोबारा ड्रिबल नहीं।","No double dribble: once you stop dribbling and catch the ball, you can't dribble again."],
    ["पैसिव प्ले: टीम गोल की कोशिश न करे तो रेफ़री हाथ उठाकर चेतावनी देता है; उसके बाद अधिकतम 4 पास में शॉट लेना होता है।","Passive play: if a team isn't trying to score, the referee raises an arm as a warning; the team then has at most 4 passes to shoot."]]},
  {t:["गोल एरिया","Goal Area"], r:[
    ["6 मी के गोल एरिया (D) में सिर्फ़ गोलकीपर जा सकता है।","Only the goalkeeper may stand in the 6 m goal area."],
    ["हमलावर खिलाड़ी हवा में कूदकर गोल एरिया के ऊपर से शॉट ले सकता है, बशर्ते बॉल छोड़ने से पहले लाइन के अंदर पैर न रखे।","An attacker may jump into the air over the goal area to shoot, as long as they release the ball before landing inside it."],
    ["डिफ़ेंडर फ़ायदे के लिए जानबूझकर गोल एरिया में घुसे तो विरोधी को 7 मी थ्रो।","A defender who deliberately enters the goal area to gain an advantage concedes a 7-metre throw."]]},
  {t:["फ़ाउल और सज़ा","Fouls & Penalties"], r:[
    ["फ़्री थ्रो: छोटे फ़ाउल पर, 9 मी की डैश लाइन के बाहर से।","Free throw: awarded for minor fouls, taken from outside the 9 m dashed line."],
    ["7 मी थ्रो (पेनल्टी): गोल का साफ़ मौका गलत तरीके से छीना जाए।","7-metre throw (penalty): awarded when a clear chance to score is illegally destroyed."],
    ["पीला कार्ड चेतावनी; 2 मिनट का निलंबन — टीम उतनी देर एक खिलाड़ी कम।","A yellow card is a warning; a 2-minute suspension leaves the team one player short for that time."],
    ["एक ही खिलाड़ी को तीसरा 2 मिनट निलंबन मिले तो लाल कार्ड — वो बाहर, पर 2 मिनट बाद टीम दूसरा खिलाड़ी ला सकती है।","A player's third 2-minute suspension brings a red card — they're out, but the team can bring on a replacement after 2 minutes."]]}
  ]},

{ id:"golf", name:["गोल्फ़","Golf"], icon:"⛳", c:"#15803d",
  body:["R&A · USGA · IGU (Indian Golf Union)","R&A · USGA · IGU (Indian Golf Union)"],
  facts:[[["राउंड","Round"],["18 होल","18 holes"]],[["क्लब","Clubs"],["अधिकतम 14","Max 14"]],[["लक्ष्य","Goal"],["सबसे कम स्ट्रोक","Fewest strokes"]],[["खोई गेंद","Lost ball"],["3 मिनट तलाश","3-min search"]]],
  sections:[
  {t:["बुनियादी नियम","Basics"], r:[
    ["एक राउंड में 18 होल; हर होल पर गेंद को टी (tee) से शुरू करके कप में डालना होता है।","A round is 18 holes; on each you play the ball from the tee into the hole."],
    ["स्ट्रोक प्ले: पूरे राउंड में सबसे कम स्ट्रोक वाला जीतता है। मैच प्ले: हर होल अलग से जीता जाता है, ज़्यादा होल जीतने वाला विजेता।","Stroke play: the fewest total strokes wins. Match play: each hole is won separately, and whoever wins more holes wins."],
    ["पार (Par): किसी होल के लिए तय स्ट्रोक। पार से 1 कम = बर्डी, 2 कम = ईगल, 1 ज़्यादा = बोगी।","Par is the expected number of strokes for a hole. One under is a birdie, two under an eagle, one over a bogey."],
    ["बैग में अधिकतम 14 क्लब रख सकते हैं।","You may carry a maximum of 14 clubs."]]},
  {t:["गेंद खेलना","Playing the Ball"], r:[
    ["गेंद जैसी पड़ी है वैसे ही खेलें (play it as it lies); अपनी पोज़िशन सुधारने के लिए कुछ दबाना या हटाना मना।","Play the ball as it lies; you may not improve your lie by pressing down or bending things."],
    ["ढीली प्राकृतिक चीज़ें (पत्ते, टहनियाँ) हटा सकते हैं, पर गेंद हिलनी नहीं चाहिए।","Loose natural objects such as leaves and twigs may be removed, as long as the ball doesn't move."],
    ["होल से सबसे दूर वाला पहले खेलता है; स्ट्रोक प्ले में 'रेडी गोल्फ़' (जो तैयार हो वो खेले) की अनुमति है।","The player farthest from the hole plays first; in stroke play 'ready golf' is encouraged."],
    ["ग्रीन पर गेंद मार्क करके उठा और साफ़ कर सकते हैं; फ़्लैगस्टिक होल में लगी रहने दे सकते हैं।","On the green you may mark, lift and clean your ball, and you may leave the flagstick in the hole."],
    ["गलती से दूसरे की गेंद खेल दी (wrong ball): स्ट्रोक प्ले में 2 स्ट्रोक पेनल्टी, मैच प्ले में होल हार।","Playing a wrong ball costs 2 penalty strokes in stroke play, or loss of the hole in match play."]]},
  {t:["पेनल्टी और राहत","Penalties & Relief"], r:[
    ["आउट ऑफ़ बाउंड्स (सफ़ेद खूँटे) या खोई गेंद: 1 पेनल्टी स्ट्रोक, और पिछली जगह से दोबारा (stroke and distance)।","Out of bounds (white stakes) or a lost ball: 1 penalty stroke and replay from where you last hit (stroke and distance)."],
    ["गेंद ढूँढने के लिए अधिकतम 3 मिनट; नहीं मिली तो खोई मानी जाती है।","You have 3 minutes to search for a ball; after that it's lost."],
    ["पेनल्टी एरिया (लाल/पीले खूँटे, जैसे पानी): 1 पेनल्टी स्ट्रोक लेकर तय जगह पर गेंद ड्रॉप कर सकते हैं — या जैसी पड़ी है वैसे खेलें।","Penalty area (red or yellow stakes, such as water): take relief with 1 penalty stroke and drop in the allowed area — or play it as it lies."],
    ["अनप्लेएबल गेंद: खिलाड़ी खुद तय करे, 1 पेनल्टी स्ट्रोक लेकर राहत।","Unplayable ball: the player may declare it unplayable and take relief for 1 penalty stroke."],
    ["कार्ट पाथ, स्प्रिंकलर जैसी चीज़ों से बिना पेनल्टी राहत (free relief) मिलती है।","Free relief is allowed from things like cart paths and sprinkler heads."],
    ["ड्रॉप घुटने की ऊँचाई से करना होता है।","Drops must be made from knee height."]]}
  ]}
,

{ id:"pickleball", name:["पिकलबॉल","Pickleball"], icon:"🥎", c:"#0891b2",
  body:["USA Pickleball नियम · भारत में तेज़ी से लोकप्रिय","USA Pickleball rules · fast-growing in India"],
  facts:[[["खिलाड़ी","Players"],["1 या 2 प्रति साइड","1 or 2 per side"]],[["स्कोरिंग","Scoring"],["11 पॉइंट, 2 की बढ़त","11 pts, win by 2"]],[["कोर्ट","Court"],["13.41 × 6.10 मी","13.41 × 6.10 m"]],[["किचन","Kitchen"],["नेट से 2.13 मी","2.13 m from net"]]],
  sections:[
  {t:["सर्विस","Service"], r:[
    ["सर्विस अंडरआर्म होती है: पैडल कमर के नीचे से ऊपर की ओर चलाते हुए बॉल मारें; 'ड्रॉप सर्व' (बॉल टप्पा खिलाकर मारना) भी मान्य है।","The serve is underhand, with an upward paddle motion and contact below the waist; a 'drop serve' (letting the ball bounce first) is also allowed."],
    ["सर्विस तिरछी (diagonal) होती है और नॉन-वॉली ज़ोन (किचन) के पार गिरनी चाहिए; किचन लाइन पर गिरी सर्विस फ़ॉल्ट।","The serve goes diagonally and must land beyond the non-volley zone (kitchen); a serve landing on the kitchen line is a fault."],
    ["सर्विस के समय कम से कम एक पैर बेसलाइन के पीछे ज़मीन पर हो, और कोई पैर बेसलाइन या कोर्ट को न छुए।","At the serve, at least one foot must be on the ground behind the baseline, and neither foot may touch the baseline or court."],
    ["हर पॉइंट पर सिर्फ़ एक सर्विस का मौका; नेट छूकर सही जगह गिरी सर्विस खेल में रहती है (कोई लेट नहीं)।","Only one serve attempt per point; a serve that clips the net and lands in is in play (no let)."]]},
  {t:["टू-बाउंस और किचन","Two-Bounce Rule & Kitchen"], r:[
    ["टू-बाउंस रूल: सर्विस के बाद रिसीवर की तरफ़ बॉल एक बार टप्पा खाए, और रिटर्न के बाद सर्वर की तरफ़ भी एक बार — उसके बाद ही वॉली (बिना टप्पे मारना) की अनुमति।","Two-bounce rule: the serve must bounce once on the receiver's side and the return must bounce once on the server's side — only then are volleys allowed."],
    ["नॉन-वॉली ज़ोन (किचन): नेट के दोनों तरफ़ 2.13 मी (7 फ़ुट) का हिस्सा, जिसमें खड़े होकर या लाइन छूकर वॉली नहीं कर सकते।","Non-volley zone (kitchen): a 7 ft (2.13 m) area on each side of the net where you can't volley while standing in it or touching its line."],
    ["वॉली मारने के बाद रफ़्तार (momentum) से किचन में चले गए, तो भी फ़ॉल्ट।","If your momentum carries you into the kitchen after a volley, it's still a fault."],
    ["बॉल किचन में टप्पा खा ले, तो आप किचन में जाकर उसे मार सकते हैं।","You may enter the kitchen to play a ball that has bounced there."]]},
  {t:["स्कोरिंग","Scoring"], r:[
    ["आमतौर पर सिर्फ़ सर्व करने वाली टीम पॉइंट जीतती है; गेम 11 पॉइंट का, 2 पॉइंट की बढ़त ज़रूरी।","Normally only the serving side scores; games go to 11 and must be won by 2."],
    ["डबल्स स्कोर तीन संख्याओं में बोला जाता है: सर्वर का स्कोर, रिसीवर का स्कोर, सर्वर नंबर (1 या 2)।","Doubles scores are called as three numbers: serving team score, receiving team score, and server number (1 or 2)."],
    ["डबल्स में दोनों पार्टनर सर्व करते हैं, पर गेम की शुरुआत वाली टीम को सिर्फ़ एक सर्वर मिलता है — इसलिए शुरुआती स्कोर '0-0-2'।","In doubles both partners serve, but the first serving team gets only one server — that's why the game starts at '0-0-2'."],
    ["कुछ टूर्नामेंट रैली स्कोरिंग (हर रैली पर पॉइंट) भी अपनाते हैं।","Some events use rally scoring, where every rally wins a point."]]},
  {t:["फ़ॉल्ट","Faults"], r:[
    ["बॉल बाहर गिरे, नेट में लगे, या नेट पार न करे।","The ball lands out, hits the net, or fails to cross it."],
    ["बॉल अपनी तरफ़ दो बार टप्पा खा ले।","The ball bounces twice on your side."],
    ["रैली के दौरान पैडल, शरीर या कपड़ों से नेट या नेट पोस्ट छूना।","Touching the net or net post with paddle, body or clothing during a rally."],
    ["लाइन पर गिरी बॉल अंदर है — सिवाय सर्विस के जो किचन लाइन पर गिरे।","A ball on the line is in — except a serve landing on the kitchen line."]]}
  ]},

    ["PAR (पॉइंट-अ-रैली): हर रैली पर पॉइंट, चाहे सर्विस किसी की हो।","Point-a-rally (PAR): every rally scores, whoever served."],
    ["गेम 11 पॉइंट का; 10-10 पर 2 पॉइंट की बढ़त ज़रूरी। मैच बेस्ट ऑफ़ 5 गेम।","Games go to 11; at 10-10 you need a 2-point lead. Matches are best of 5 games."],
    ["रैली जीतने वाला सर्व करता है।","The rally winner serves."]]},
  {t:["सर्विस","Service"], r:[
    ["सर्वर का कम से कम एक पैर सर्विस बॉक्स के अंदर ज़मीन पर, लाइन को छुए बिना।","The server must have at least one foot on the floor inside the service box, not touching the line."],
    ["बॉल सामने की दीवार पर सर्विस लाइन और आउट लाइन के बीच लगे, और (अगर वॉली न की जाए) सामने वाले के पीछे के क्वार्टर में गिरे।","The ball must hit the front wall between the service line and the out line, and — unless volleyed — land in the opposite back quarter."],
    ["पॉइंट जीतकर सर्विस जारी रखने वाला सर्वर हर बार सर्विस बॉक्स बदलता है।","A server who keeps the serve switches service boxes after each point."]]},
  {t:["रैली","The Rally"], r:[
    ["बॉल ज़मीन पर गिरने से पहले सामने की दीवार पर लगनी चाहिए; बीच में बगल या पीछे की दीवार से लग सकती है।","The ball must reach the front wall before touching the floor; it may hit side or back walls on the way."],
    ["बॉल ज़मीन पर अधिकतम एक बार टप्पा खा सकती है।","The ball may bounce on the floor at most once."],
    ["बॉल टिन (सामने नीचे की पट्टी) या आउट लाइन पर/ऊपर लगी तो आउट।","A ball hitting the tin (the low strip on the front wall) or on or above the out lines is out."]]},
  {t:["लेट और स्ट्रोक","Lets & Strokes"], r:[
    ["खिलाड़ी को शॉट के बाद विरोधी को बॉल तक सीधा रास्ता और खेलने की जगह देनी होती है।","After playing a shot, you must give your opponent direct access to the ball and room to play it."],
    ["लेट (Let): रुकावट हुई पर कोई गलती नहीं, या खिलाड़ी बॉल तक पहुँच सकता था — रैली दोबारा।","Let: interference occurred but neither player is at fault, or the striker could have reached the ball — the rally is replayed."],
    ["स्ट्रोक (Stroke): विरोधी ने रास्ता नहीं छोड़ा, या रुकावट न होती तो विजयी शॉट बनता — पॉइंट रोके गए खिलाड़ी को।","Stroke: the opponent didn't clear, or the striker would have hit a winner — the point goes to the obstructed player."],
    ["नो लेट: खिलाड़ी बॉल तक पहुँच ही नहीं सकता था, या रुकावट नाममात्र थी — पॉइंट विरोधी को।","No let: the striker couldn't have reached the ball, or the interference was minimal — the opponent wins the point."],
    ["बॉल विरोधी को लगे और वो सीधे सामने की दीवार पर जा रही थी तो स्ट्रोक (मारने वाले का पॉइंट); वरना लेट।","If the ball hits the opponent on its way directly to the front wall, it's a stroke to the striker; otherwise it's a let."]]}
  ]},

{ id:"athletics", name:["एथलेटिक्स","Athletics"], icon:"🏅", c:"#c2410c",

  sections:[

    ["100 मी, 200 मी, 400 मी और हर्डल्स में पूरी दौड़ अपनी लेन में।","In the 100 m, 200 m, 400 m and hurdles you must stay in your own lane throughout."],
    ["800 मी में पहले मोड़ (bend) के बाद लेन छोड़कर अंदर आ सकते हैं।","In the 800 m runners may break for the inside lane after the first bend."],
    ["दौड़ तब पूरी होती है जब धड़ (torso) — सिर, हाथ या पैर नहीं — फ़िनिश लाइन पार करे; फ़ोटो-फ़िनिश से 1/1000 सेकंड तक फ़ैसला।","A runner finishes when their torso — not head, arms or legs — crosses the line; photo-finish separates times to 1/1000 s."],
    ["हर्डल जानबूझकर हाथ या पैर से गिराना, या बगल से पैर निकालना फ़ाउल; अनजाने में गिर जाना ठीक है।","Deliberately knocking a hurdle down or trailing a leg around it is a foul; accidentally hitting one is fine."]]},
  {t:["रिले","Relays"], r:[

    ["बैटन गिर जाए तो गिराने वाला ही उठाए, बिना दूसरों को रोके।","If the baton is dropped, the athlete who dropped it must pick it up without obstructing others."],
    ["4×400 मी में पहले धावक का पूरा लैप और दूसरे का पहला मोड़ लेन में; उसके बाद अंदर आ सकते हैं।","In the 4×400 m, the first leg and the first bend of the second leg are run in lanes; then runners may cut in."]]},
  {t:["जंप इवेंट","Jumps"], r:[

    ["ट्रिपल जंप का क्रम: हॉप (उसी पैर पर), स्टेप (दूसरे पैर पर), फिर जंप।","Triple jump sequence: hop (same foot), step (other foot), then jump."],
    ["हाई जंप और पोल वॉल्ट: एक ऊँचाई पर लगातार 3 नाकाम प्रयास = बाहर। एथलीट कोई ऊँचाई छोड़ (pass) भी सकता है।","High jump and pole vault: three consecutive failures eliminate you. Athletes may also pass heights."],

  {t:["थ्रो इवेंट","Throws"], r:[
    ["शॉट पुट, डिस्कस, हैमर और जैवलिन — गोला/भाला तय सेक्टर लाइनों के अंदर गिरना चाहिए।","Shot put, discus, hammer and javelin must land inside the sector lines."],
    ["जैवलिन धातु की नोक (tip) पहले ज़मीन छुए तभी वैध; दौड़कर आर्क लाइन के पार पैर नहीं जाना चाहिए।","A javelin is valid only if the metal tip lands first; the thrower mustn't step beyond the arc."],
    ["फ़ेंकने वाला चीज़ ज़मीन पर गिरने से पहले सर्कल/रनवे नहीं छोड़ सकता, और पीछे के आधे हिस्से से बाहर निकलना होता है।","Throwers may not leave the circle or runway until the implement lands, and must exit from the back half."],
    ["शॉट पुट 'पुट' किया जाता है — कंधे के पास से धकेलना, फेंकना नहीं।","The shot is 'put' — pushed from the shoulder, not thrown."],
    ["फ़ाइनल में सभी को 3 प्रयास; टॉप 8 को 3 और। सबसे अच्छा एक प्रयास गिना जाता है।","In finals everyone gets 3 attempts; the top 8 get 3 more. The single best counts."]]},
  {t:["रिकॉर्ड और रेस वॉक","Records & Race Walk"], r:[
    ["100 मी, 200 मी, हर्डल्स, लॉन्ग जंप और ट्रिपल जंप में पीछे से हवा +2.0 मी/से से ज़्यादा हो तो रिकॉर्ड मान्य नहीं।","In the 100 m, 200 m, hurdles, long jump and triple jump, a tailwind above +2.0 m/s means records don't count."],

    ["लिफ़्टर वज़न वर्ग में मुक़ाबला करते हैं; वज़न मुक़ाबले से 2 घंटे पहले।","Lifters compete in bodyweight categories, weighing in 2 hours before."],
    ["बार पर वज़न कभी कम नहीं होता — अगला प्रयास कम से कम 1 किलो ज़्यादा।","The bar never gets lighter — each attempt must be at least 1 kg heavier."]]},
  {t:["वैध लिफ़्ट","Good Lift"], r:[

    ["3 रेफ़री होते हैं; कम से कम 2 सफ़ेद लाइट = वैध लिफ़्ट।","There are 3 referees; at least 2 white lights means a good lift."],
    ["नाम पुकारे जाने के बाद 1 मिनट में लिफ़्ट शुरू करनी होती है; अपने ही लगातार प्रयास में 2 मिनट।","You have 1 minute to start after being called, or 2 minutes for consecutive attempts of your own."]]},
  {t:["नाकाम लिफ़्ट","No Lift"], r:[
    ["प्रेस-आउट: बाँह मुड़ने के बाद धकेलकर सीधी करना।","Press-out: bending and then pushing the arms straight overhead."],
    ["पैरों के अलावा शरीर का कोई हिस्सा (जैसे घुटना) प्लेटफ़ॉर्म छू जाए।","Any part of the body other than the feet touching the platform (such as a knee)."],
    ["'डाउन' सिग्नल से पहले बार नीचे लाना, या बार को पीछे गिरा देना।","Lowering the bar before the 'down' signal, or dropping it behind."],
    ["क्लीन में बार को कंधों पर रखने से पहले छाती से छुआना; प्लेटफ़ॉर्म से बाहर पैर रखना।","Touching the bar to the chest before racking it in the clean, or stepping off the platform."]]},
  {t:["जीत","Winning"], r:[

    ["टोटल बराबर हो तो जिसने वो टोटल पहले हासिल किया, वो आगे।","If totals are equal, the lifter who reached that total first ranks higher."]]}

  {t:["स्कोरिंग","Scoring"], r:[
    ["टारगेट में 10 घेरे, बीच वाला 10। राइफ़ल में डेसिमल स्कोरिंग — एक शॉट अधिकतम 10.9।","Targets have 10 rings with 10 in the centre. Rifle uses decimal scoring — up to 10.9 per shot."],

function hl(text, ts=[]){
  if(!ts.length) return esc(text);
  const re = new RegExp('('+ts.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return String(text).split(re).map((p,i)=> i%2 ? '<mark>'+esc(p)+'</mark>' : esc(p)).join('');
}

/* ================= EFFECTS ================= */
let io, spy, timers=[];
function reveal(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.06});
  app.querySelectorAll('.rv').forEach((el,i)=>{ el.style.setProperty('--d',(Math.min(i,8)*55)+'ms'); io.observe(el); });
  timers.push(setTimeout(()=>app.querySelectorAll('.rv:not(.in)').forEach(el=>{ if(el.getBoundingClientRect().top<innerHeight) el.classList.add('in'); }),900));
}
function countUp(){
  app.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, t0=performance.now(), d=1300;
    const step=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
document.addEventListener('pointermove', e=>{
  const c = e.target.closest && e.target.closest('.gc'); if(!c) return;
  const r=c.getBoundingClientRect(); c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px');
});
function typer(el){
  const words = lang==='en'
    ? ["LBW","offside","checkmate","deuce","kho","shot clock","super over","libero","queen cover"]
    : ["LBW","ऑफ़साइड","चेकमेट","ड्यूस","खो","शॉट क्लॉक","सुपर ओवर","लिबेरो","क्वीन कवर"];
  let w=0,i=0,del=false;
  const tick=()=>{ if(!document.body.contains(el)) return;
    const s=words[w]; el.textContent = s.slice(0,i);
    if(!del && i<s.length) i++; else if(!del){ del=true; timers.push(setTimeout(tick,1200)); return; }
    else if(i>0) i--; else { del=false; w=(w+1)%words.length; }
    timers.push(setTimeout(tick, del?45:90)); };
  tick();
}

const pal=document.getElementById('pal'), pin=document.getElementById('pin'), plist=document.getElementById('plist'), pchips=document.getElementById('pchips');

function openPal(q){ pal.classList.add('on'); pal.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
  pin.value=q||''; pFilter='all'; runPal(); setTimeout(()=>pin.focus(),30); }
function closePal(){ pal.classList.remove('on'); pal.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
function runPal(){
  const ts=terms(pin.value);

    pchips.innerHTML=''; pItems=[]; document.getElementById('pcount').textContent='';
    plist.innerHTML=`<div class="phint">${ui('pHint')}<div class="sugg">${sugg().map(s=>`<button data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;

  }

  const counts={}; res.forEach(x=>counts[x.g.id]=(counts[x.g.id]||0)+1);
  if(pFilter!=='all'&&!counts[pFilter]) pFilter='all';
  const shown=(pFilter==='all'?res:res.filter(x=>x.g.id===pFilter)).slice(0,80);
  pchips.innerHTML = res.length ? `<button data-f="all" class="${pFilter==='all'?'on':''}">${ui('all')} · ${res.length}</button>`+
    GAMES.filter(g=>counts[g.id]).map(g=>`<button data-f="${g.id}" class="${pFilter===g.id?'on':''}">${g.icon} ${esc(L(g.name))} · ${counts[g.id]}</button>`).join('') : '';
  pchips.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ pFilter=b.dataset.f; runPal(); pin.focus(); });
  let html='';
  if(gl.length && pFilter==='all'){ html+=`<div class="pgrp">${ui('terms')}</div>`+gl.slice(0,4).map(t=>`<a class="pi" href="#/game/${t[2]}" style="--tc:${byId[t[2]].c}"><span class="e">📖</span><div><div class="m"><b>${byId[t[2]].icon} ${esc(L(byId[t[2]].name))}</b></div><div class="t"><b>${B([t[0],t[1]],ts)}</b> — ${B([t[3],t[4]],ts)}</div></div></a>`).join(''); }
  if(shown.length){ html+=`<div class="pgrp">${ui('rulesG')}</div>`+shown.map(x=>`<a class="pi" href="#/game/${x.g.id}/${x.id}" style="--tc:${x.g.c}"><span class="e">${x.g.icon}</span><div><div class="m"><b>${esc(L(x.g.name))}</b> › ${esc(L(x.s.t))}</div><div class="t">${B(x.p,ts)}</div></div></a>`).join(''); }
  if(!html) html=`<div class="phint">${ui('none')}</div>`;
  plist.innerHTML=html;
  pItems=[...plist.querySelectorAll('.pi')]; pSel=0; markSel();
  pItems.forEach((a,i)=>{ a.onclick=closePal; a.onmousemove=()=>{ if(pSel!==i){pSel=i;markSel(false);} }; });
  document.getElementById('pcount').textContent = `${res.length} ${ui('found')}`;
}
function markSel(scroll=true){ pItems.forEach((a,i)=>a.classList.toggle('sel',i===pSel)); if(scroll&&pItems[pSel]) pItems[pSel].scrollIntoView({block:'nearest'}); }
pin.addEventListener('input',runPal);
pin.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); pSel=Math.min(pItems.length-1,pSel+1); markSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); pSel=Math.max(0,pSel-1); markSel(); }
  else if(e.key==='Enter' && pItems[pSel]){ e.preventDefault(); closePal(); go(pItems[pSel].getAttribute('href')); }
});

/* ================= READ ALOUD ================= */
let dykCur=null;
const TTS={ ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window), voices:[], q:[], i:0, active:false, playing:false,
  vlang:null, rate:1, tok:0, accent:null, key:null };
function ttsLoadVoices(){ try{ TTS.voices=speechSynthesis.getVoices()||[]; }catch(e){ TTS.voices=[]; } }
if(TTS.ok){ ttsLoadVoices(); try{ speechSynthesis.addEventListener('voiceschanged',ttsLoadVoices); }catch(e){} }
function ttsVoice(l){
  const v=TTS.voices; if(!v.length) return null;
  const by=re=>v.filter(x=>re.test(x.lang.replace('_','-')));
  const pref=list=>list.find(x=>/google|natural|neural|premium|enhanced/i.test(x.name))||list[0];
  return l==='hi' ? pref(by(/^hi-IN/i))||pref(by(/^hi/i))
                  : pref(by(/^en-IN/i))||pref(by(/^en-GB/i))||pref(by(/^en-US/i))||pref(by(/^en/i));
}
function ttsClean(t,l){
  const hi=l==='hi', N='(\\d+(?:\\.\\d+)?)', E='(?=[\\s,.;:!?।)]|$)';
  let x=String(t);
  // symbols that should never be voiced literally
  x=x.replace(/½-½/g, hi?'आधा आधा':'half each')
     .replace(/×/g, hi?' गुणा ':' by ').replace(/·/g,', ').replace(/→/g,', ').replace(/[—]/g,', ')
     .replace(/=/g, hi?' बराबर ':' equals ');
  // fractions, rates and alternatives written with "/"
  x=x.replace(/1\/1000 s\b/g,'a thousandth of a second').replace(/1\/1000 सेकंड/g,'सेकंड के हज़ारवें हिस्से')
     .replace(/m\/s\b/g,'metres per second').replace(/मी\/से/g,'मीटर प्रति सेकंड')
     .replace(new RegExp(N+'\\/'+N,'g'), hi?'$1 या $2':'$1 or $2')
     .replace(/\s*\/\s*/g, hi?' या ':' or ');
  // plus signs
  x=x.replace(new RegExp('\\+'+N,'g'), hi?'प्लस $1':'plus $1')
     .replace(new RegExp(N+'\\+','g'), hi?'$1 से ज़्यादा':'$1 plus')
     .replace(/\s\+\s/g, hi?' और ':' plus ');
  // number–number patterns: seasons, call-outs, ties/scores, ranges
  x=x.replace(/\b(\d{4})[-–](\d{2})\b/g,(m,a,b)=>hi?`${a} ${b}`:`${a} to ${a.slice(0,2)}${b}`)
     .replace(/\b(\d+)-(\d+)-(\d+)\b/g,'$1, $2, $3')
     .replace(new RegExp(N+'\\s*[-–]\\s*'+N,'g'),(m,a,b)=> a===b ? (hi?`${a} ${b}`:`${a} all`) : (hi?`${a} से ${b}`:`${a} to ${b}`))
     .replace(/\s[-–]\s/g,', ')
     .replace(/[-–]/g,' ');               // any hyphen left is a compound word: read it as a space
  // units after numbers
  if(hi){
    x=x.replace(new RegExp(N+'\\s*सेमी'+E,'g'),'$1 सेंटीमीटर').replace(new RegExp(N+'\\s*मिमी'+E,'g'),'$1 मिलीमीटर')
       .replace(new RegExp(N+'\\s*मी'+E,'g'),'$1 मीटर');
  } else {
    x=x.replace(new RegExp(N+'\\s*cm'+E,'g'),'$1 centimetres').replace(new RegExp(N+'\\s*mm'+E,'g'),'$1 millimetres')
       .replace(new RegExp(N+'\\s*m'+E,'g'),'$1 metres').replace(new RegExp(N+'\\s*s'+E,'g'),'$1 seconds');
  }
  return x.replace(/\s+([,.;:।])/g,'$1').replace(/\s+/g,' ').trim();
}
function ttsText(it,l){
  const k=l==='hi'?0:1;
  if(it.intro) return l==='hi' ? `${it.g.name[0]} नियमावली।` : `${it.g.name[1]} rulebook.`;
  if(it.head) return l==='hi' ? `भाग ${it.si+1}. ${it.g.sections[it.si].t[0]}।` : `Section ${it.si+1}. ${it.g.sections[it.si].t[1]}.`;
  return ttsClean(it.p[k],l);
}
function ttsLabel(it,l){
  const k=l==='hi'?0:1, nm=`${it.g.icon} ${esc(it.g.name[k])}`;
  if(it.intro) return `<b>${nm}</b>`;
  if(it.head) return `<b>${nm}</b> · ${UI.section[k]} ${it.si+1}`;
  if(it.dyk) return `<b>${nm}</b> · ${UI.didYou[k]}`;
  return `<b>${nm}</b> · ${UI.rule[k]} ${it.si+1}.${it.ri+1}`;
}
const EQ='<span class="eq"><i></i><i></i><i></i></span>';
function ttsMark(){
  document.querySelectorAll('.rules li.speaking').forEach(e=>e.classList.remove('speaking'));
  document.querySelectorAll('.sec.speaking-h').forEach(e=>e.classList.remove('speaking-h'));
  document.querySelectorAll('.spk.eqon').forEach(b=>{ b.classList.remove('eqon'); });
  document.querySelectorAll('[data-src]').forEach(b=>{
    const mine = TTS.active && b.dataset.src===TTS.src;

    b.classList.toggle('on', mine);
    b.innerHTML = b.classList.contains('spk') ? icon : icon+`<span>${mine?(TTS.playing?ui('pause'):ui('resume')):b.dataset.lbl}</span>`;
    b.setAttribute('aria-label', mine?(TTS.playing?ui('pause'):ui('resume')):(b.dataset.lbl||ui('listen')));
  });
  if(!TTS.active) return;
  const it=TTS.q[TTS.i]; if(!it||!it.id) return;
  const el=document.getElementById(it.id); if(!el) return;
  const sec=el.closest('.sec'); if(sec) setOpen(sec,true);
  if(it.head){ el.classList.add('speaking-h'); }
  else { el.classList.add('speaking'); const b=el.querySelector('.spk'); if(b&&TTS.playing&&!b.classList.contains('on')){ b.classList.add('eqon'); b.innerHTML=EQ; } }

    const y=scrollY+r.top-Math.max(130,(innerHeight-ph-r.height)/2); scrollTo({top:Math.max(0,y),behavior:'smooth'}); }
}
function ttsUI(){
  const pl=document.getElementById('player');
  pl.classList.toggle('on',TTS.active); document.body.classList.toggle('tts-on',TTS.active);
  if(!TTS.active){ ttsMark(); return; }
  pl.style.setProperty('--c',TTS.accent||'');
  const it=TTS.q[TTS.i], l=TTS.vlang, k=l==='hi'?0:1;
  document.getElementById('tPlay').innerHTML=TTS.playing?ICON.pause:ICON.play;
  document.getElementById('tLabel').innerHTML=it?ttsLabel(it,l)+` <span>${TTS.i+1}/${TTS.q.length}</span>`:'';
  document.getElementById('tNow').textContent=it?ttsText(it,l):'';
  document.getElementById('tRate').textContent=TTS.rate+'×';
  document.querySelectorAll('#player .vl button').forEach(b=>b.classList.toggle('on',b.dataset.v===l));
  const note=document.getElementById('tNote'), missing=TTS.voices.length && !ttsVoice(l);
  note.textContent = missing ? (l==='hi'?UI.noVoice[k]:UI.noVoiceEn[k]) : '';
  note.classList.toggle('hidden',!missing);
  document.getElementById('tPg').style.width=((TTS.i+(TTS.playing?0.5:0))/Math.max(1,TTS.q.length)*100)+'%';
  ttsMark();
}
function ttsSpeak(){
  const tok=++TTS.tok;
  try{ speechSynthesis.cancel(); }catch(e){}
  const it=TTS.q[TTS.i]; if(!it){ ttsStop(); return; }
  TTS.playing=true; ttsUI();
  const l=TTS.vlang, u=new SpeechSynthesisUtterance(ttsText(it,l));
  u.lang = l==='hi'?'hi-IN':'en-IN'; const v=ttsVoice(l); if(v){ u.voice=v; u.lang=v.lang; }
  u.rate=TTS.rate; u.pitch=1;
  const done=()=>{ if(tok!==TTS.tok) return; if(TTS.i<TTS.q.length-1){ TTS.i++; ttsSpeak(); } else ttsStop(); };
  u.onend=done;
  u.onerror=e=>{ if(tok!==TTS.tok) return; if(e&&(e.error==='interrupted'||e.error==='canceled')) return; done(); };
  // Some browsers need a tick after cancel() before speak()
  setTimeout(()=>{ if(tok===TTS.tok) speechSynthesis.speak(u); },60);
}
function ttsPlay(items,start,accent,single){
  if(!TTS.ok){ alertNote(); return; }
  ttsLoadVoices();
  TTS.q=items; TTS.i=Math.max(0,start||0); TTS.active=true; TTS.accent=accent; TTS.follow=!single;
  if(!TTS.vlang) TTS.vlang=lang;
  ttsSpeak();
}
function ttsSrc(src,startFn){
  if(TTS.active && TTS.src===src && TTS.q.length){ TTS.playing?ttsPause():ttsSpeak(); return; }
  TTS.src=src; startFn();
}
function ttsPause(){ TTS.tok++; TTS.playing=false; try{ speechSynthesis.cancel(); }catch(e){} ttsUI(); }
function ttsStop(){ TTS.tok++; try{ speechSynthesis.cancel(); }catch(e){} TTS.active=false; TTS.playing=false; TTS.q=[]; TTS.i=0; TTS.src=null; ttsUI(); }
function alertNote(){ toast(ui('noTTS')); }
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),5000); }
document.getElementById('tPlay').onclick=()=>{ if(!TTS.q.length) return ttsStop(); TTS.playing?ttsPause():ttsSpeak(); };

document.getElementById('tRate').onclick=()=>{ const r=[0.8,1,1.25,1.5]; TTS.rate=r[(r.indexOf(TTS.rate)+1)%r.length]; if(TTS.playing) ttsSpeak(); else ttsUI(); };

addEventListener('pagehide',()=>{ try{ speechSynthesis.cancel(); }catch(e){} });

/* ================= ROUTER ================= */
function readHash(){ try{ return location.hash && location.hash.startsWith('#/') ? location.hash : '#/'; }catch(e){ return '#/'; } }
let ROUTE = readHash();
let lastRoute='';
function render(keep){
  timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); timers=[];
  const parts=ROUTE.replace(/^#\/?/,'').split('/');
  const route = parts[0]==='game' ? 'game/'+parts[1] : parts[0];
  if(route!==lastRoute && lastRoute && TTS.active) ttsStop();
  if(parts[0]==='game'){ updateChrome(parts[1]); pageGame(parts[1],parts[2]); }
  else if(parts[0]==='guide'){ updateChrome('guide'); pageGuide(); }
  else { updateChrome('home'); pageHome(); }
  reveal();
  if(!keep && !parts[2] && route!==lastRoute) scrollTo({top:0,behavior:'instant'});
  lastRoute=route; onScroll();
  if(TTS.active) ttsUI();
}
function onScroll(){
  const p=document.getElementById('prog');
  if(!ROUTE.startsWith('#/game')){ p.style.width='0'; return; }
  const h=document.documentElement.scrollHeight-innerHeight; p.style.width=(h>0?scrollY/h*100:0)+'%';
}
addEventListener('scroll',onScroll,{passive:true});
let lastY=0;
addEventListener('scroll',()=>{ const y=scrollY; if(Math.abs(y-lastY)<8) return;
  document.body.classList.toggle('tabs-hide', y>lastY && y>160); lastY=y; },{passive:true});
function transition(fn){ if(document.startViewTransition){ try{ document.startViewTransition(fn); return; }catch(e){} } fn(); }
function go(h){ ROUTE=h||'#/'; try{ history.pushState(null,'',ROUTE); }catch(e){} transition(()=>render()); }
document.addEventListener('click',e=>{
  const a=e.target.closest && e.target.closest('a[href^="#/"]'); if(!a) return;
  e.preventDefault(); go(a.getAttribute('href'));
});
addEventListener('popstate',()=>{ ROUTE=readHash(); transition(()=>render()); });
applyTheme(document.documentElement.dataset.theme);
render();
</script>
</body>
</html>
