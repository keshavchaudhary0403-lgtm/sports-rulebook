<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports Rulebook</title>
<meta name="description" content="Rules of 24 sports — cricket, football, kabaddi, chess and more — in Hindi and English. Searchable, with read-aloud.">
<meta name="theme-color" content="#c6f432">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"%3E %3Crect width="32" height="32" rx="8" fill="%23c6f432"/%3E %3Cpath d="M6 10.6c3.2-1.8 6.6-1.8 10 0v14c-3.4-1.8-6.8-1.8-10 0zM16 10.6c3.4-1.8 6.8-1.8 10 0v14c-3.2-1.8-6.6-1.8-10 0z" fill="none" stroke="%2314160f" stroke-width="2.1" stroke-linejoin="round"/%3E %3Cpath d="M9.2 15h3.4M9.2 18.6h3.4M19.4 15h3.4M19.4 18.6h3.4" stroke="%2314160f" stroke-width="1.7" stroke-linecap="round"/%3E %3Ccircle cx="25" cy="7" r="3.6" fill="%2314160f"/%3E %3C/svg%3E'>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:title" content="Sports Rulebook">
<meta property="og:description" content="Rules of 24 sports in Hindi and English — searchable, with read-aloud.">
<meta property="og:image" content="/icon-512.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  (function(){var t=null;try{t=localStorage.getItem('krb-theme')}catch(e){}
  if(t!=='dark')t='light';
  document.documentElement.dataset.theme=t;})();
</script>
<style>
:root{
  --bg:#f5f4ef; --bg2:#ffffff; --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.9);
  --text:#14160f; --muted:#5f6457; --line:rgba(20,22,15,.1); --chip:rgba(20,22,15,.05);
  --shadow:0 1px 2px rgba(20,22,15,.04),0 12px 32px -14px rgba(20,22,15,.18);
  --lime:#c6f432; --accent:#4d7c0f;
  --b1:#c6f432; --b2:#2dd4bf; --b3:#fdba74; --blob:.4; --grid:rgba(20,22,15,.07);
  --brand:linear-gradient(100deg,#4d7c0f 0%,#0f9f6e 50%,#0e7490 100%);
  --c:var(--accent); --r:22px;
  --fh:"Space Grotesk","Noto Sans Devanagari",system-ui,sans-serif;
  --fb:"Inter","Noto Sans Devanagari",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c08; --bg2:#13160f; --glass:rgba(22,26,18,.6); --glass2:rgba(26,30,21,.92);
    --text:#f1f4ea; --muted:#9aa190; --line:rgba(255,255,255,.08); --chip:rgba(255,255,255,.06);
    --shadow:0 12px 40px -16px rgba(0,0,0,.75); --accent:#c6f432; --blob:.2; --grid:rgba(255,255,255,.045);
    --brand:linear-gradient(100deg,#d4ff3a 0%,#3ef0a0 50%,#38d6ff 100%); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c08; --bg2:#13160f; --glass:rgba(22,26,18,.6); --glass2:rgba(26,30,21,.92);
    --text:#f1f4ea; --muted:#9aa190; --line:rgba(255,255,255,.08); --chip:rgba(255,255,255,.06);
    --shadow:0 12px 40px -16px rgba(0,0,0,.75); --accent:#c6f432; --blob:.2; --grid:rgba(255,255,255,.045);
    --brand:linear-gradient(100deg,#d4ff3a 0%,#3ef0a0 50%,#38d6ff 100%); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
mark{background:color-mix(in srgb,var(--c) 30%,transparent);color:inherit;border-radius:4px;padding:0 2px}
::selection{background:color-mix(in srgb,var(--c) 35%,transparent)}

/* ---------- Ambient background ---------- */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob);
  animation:drift 24s ease-in-out infinite alternate;transition:background 1s}
.bgfx i:nth-child(1){width:55vmax;height:55vmax;background:var(--b1);top:-25vmax;left:-15vmax}
.bgfx i:nth-child(2){width:50vmax;height:50vmax;background:var(--b2);bottom:-28vmax;right:-18vmax;animation-delay:-8s}
.bgfx i:nth-child(3){width:32vmax;height:32vmax;background:var(--b3);top:35%;left:45%;animation-delay:-15s}
.bgfx::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px;
  mask-image:linear-gradient(to bottom,#000 0%,transparent 70%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 70%)}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18)}}

.wrap{max-width:1160px;margin:0 auto;padding:0 16px}

/* ---------- Nav ---------- */
.navwrap{position:sticky;top:0;z-index:30;padding:12px 0 6px;isolation:isolate}
.navwrap::before{content:"";position:absolute;inset:0 0 -18px;z-index:-1;pointer-events:none;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  mask-image:linear-gradient(#000 78%,transparent);-webkit-mask-image:linear-gradient(#000 78%,transparent)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--glass);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.logo .mk{width:36px;height:36px;flex:none;display:block;filter:drop-shadow(0 6px 14px rgba(120,160,0,.35));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.logo:hover .mk{transform:rotate(-10deg) scale(1.06)}
.logo .mk .ball{transform-origin:24px 10px;animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-2px)}}
.logo .tx b{font-weight:700}
.logo .tx span{font-weight:500;color:var(--muted);margin-left:4px}
.strig{flex:1;display:flex;align-items:center;gap:10px;min-width:0;padding:9px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--chip);color:var(--muted);font-size:14px;text-align:left;transition:border-color .2s,background .2s}
.strig:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line));background:var(--glass2)}
.strig span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--fm);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);color:var(--muted)}
.seg{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:3px;position:relative}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.25s;white-space:nowrap}
.seg button.on{background:var(--bg2);color:var(--text);box-shadow:0 2px 8px -2px rgba(0,0,0,.18)}
.ibtn{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--chip);transition:.25s}
.ibtn:hover{background:var(--glass2);transform:rotate(-12deg)}
.ibtn svg{width:18px;height:18px}
.navlink{font-size:14px;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:10px;white-space:nowrap;transition:.2s}
.navlink:hover,.navlink.on{color:var(--text);background:var(--chip)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.25s}
.tab:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--tc) 50%,var(--line))}
.tab.on{background:var(--tc);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px var(--tc)}
.tab.on.home{color:var(--bg)}

/* ---------- Reveal ---------- */
.rv{opacity:0;transform:translateY(18px) scale(.985);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.rv.in{opacity:1;transform:none}

main.wrap{padding-top:22px;padding-bottom:28px;min-height:70vh}
.alt{display:block;color:var(--muted);font-size:.9em;margin-top:3px;font-weight:400}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.kicker .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
.grad{background:var(--brand);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:200% center}}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- Home ---------- */
.hero{padding:44px 0 26px;text-align:center}
.hero h1{font-family:var(--fh);font-size:clamp(38px,7vw,80px);line-height:1.04;letter-spacing:-.04em;margin:18px auto 14px;max-width:16ch;font-weight:700}
.hero p{color:var(--muted);font-size:clamp(16px,2vw,19px);max-width:56ch;margin:0 auto 26px}
.bigsearch{display:flex;align-items:center;gap:12px;width:min(640px,100%);margin:0 auto;padding:16px 18px;border-radius:18px;
  font-size:16px;color:var(--muted);text-align:left;position:relative;overflow:hidden}
.bigsearch::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--brand);background-size:200%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:shine 5s linear infinite;opacity:.8}
.bigsearch span{flex:1}
.bigsearch .typer::after{content:"|";animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.sugg button{border:1px solid var(--line);background:var(--glass);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:500;transition:.2s;backdrop-filter:blur(8px)}
.sugg button:hover{transform:translateY(-2px);border-color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px;margin:30px auto 0}
.stat{padding:16px;text-align:center}
.stat b{display:block;font-family:var(--fh);font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

.ticker{overflow:hidden;margin:34px 0 26px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;gap:10px;width:max-content;animation:scroll 50s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.track a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.track a i{width:7px;height:7px;border-radius:50%;background:var(--tc);font-style:normal}
@keyframes scroll{to{transform:translateX(-50%)}}

.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 14px}
.sec-h h2{font-family:var(--fh);font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;margin:0;line-height:1.2}
.sec-h p{margin:0;color:var(--muted);font-size:14px}

.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.gc{grid-column:span 2;position:relative;overflow:hidden;padding:22px;min-height:250px;display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s;isolation:isolate}
.gc.big{grid-column:span 3;min-height:270px}
.gc::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--tc) 22%,transparent),transparent 60%)}
.gc::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 14%,transparent),transparent 55%)}
.gc:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--tc) 45%,var(--line));box-shadow:0 24px 50px -24px var(--tc)}
.gc:hover::before{opacity:1}
.gc .emo{position:absolute;right:-8px;top:-6px;font-size:96px;line-height:1;opacity:.95;transform:rotate(12deg);transition:transform .5s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 12px 18px rgba(0,0,0,.18))}
.gc:hover .emo{transform:rotate(-6deg) scale(1.1) translateY(4px)}
.gc .tag{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);padding:4px 10px;border-radius:999px}
.gc h3{font-family:var(--fh);font-size:28px;letter-spacing:-.03em;margin:12px 0 2px;line-height:1.15}
.gc h3 .alt{font-size:15px;font-family:var(--fb);letter-spacing:0}
.gc .meta{font-size:13px;color:var(--muted);margin-bottom:14px}
.gc .fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.gc .fl span{font-size:12px;padding:5px 9px;border-radius:9px;background:var(--chip);border:1px solid var(--line)}
.gc .go{position:absolute;right:18px;bottom:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--tc);color:#fff;transform:scale(.85);opacity:.9;transition:.35s}
.gc:hover .go{transform:scale(1) rotate(-45deg);opacity:1}
.gc .fl{padding-right:50px}

.dyk{grid-column:span 4;padding:22px 24px;display:flex;flex-direction:column;gap:10px;min-height:200px;position:relative;overflow:hidden}
.dyk .lbl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dyk .lbl b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dyk .body{font-size:clamp(17px,2.2vw,21px);line-height:1.5;font-weight:500;transition:opacity .4s,transform .4s}
.dyk .body.out{opacity:0;transform:translateY(8px)}
.dyk .body .alt{font-size:.78em}
.dyk .src{font-size:13px;color:var(--muted);margin-top:auto}
.dyk .src b{color:var(--tc)}
.dyk .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--tc,var(--c));width:0}
.dyk .bar.run{animation:fill 7s linear forwards}
@keyframes fill{to{width:100%}}
.gcard2{grid-column:span 6;padding:22px;display:flex;flex-direction:column;gap:14px;min-height:200px;position:relative;overflow:hidden;isolation:isolate;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s}
.gcard2::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%)}
.gcard2:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.gcard2 .top{display:flex;align-items:center;justify-content:space-between}
.gcard2 .tag2{font-size:12px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:4px 10px;border-radius:999px}
.gcard2 .go2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg);transition:transform .35s}
.gcard2:hover .go2{transform:rotate(-45deg)}
.gcard2 .avs{display:flex;margin-top:auto;overflow:hidden;padding:2px}
.gcard2 .avs span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;margin-left:-10px;
  background:color-mix(in srgb,var(--tc) 22%,var(--bg2));border:2px solid var(--bg2);transition:margin .35s cubic-bezier(.2,.7,.2,1)}
.gcard2 .avs span:first-child{margin-left:0}
.gcard2 .avs span.more{font-size:13px;font-weight:700;font-family:var(--fh);color:var(--text);background:color-mix(in srgb,var(--text) 8%,var(--bg2))}
.gcard2:hover .avs span{margin-left:-2px}
.gcard2 h3{font-family:var(--fh);font-size:24px;letter-spacing:-.03em;margin:0;line-height:1.2}
.gcard2 p{color:var(--muted);font-size:14px;margin:4px 0 0}

/* ---------- Game page ---------- */
.progress{position:fixed;left:0;top:0;height:3px;width:0;background:var(--c);z-index:60;box-shadow:0 0 12px var(--c);transition:width .1s}
.ghero{position:relative;overflow:hidden;padding:30px 28px;margin-bottom:18px;isolation:isolate}
.ghero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 26%,transparent),transparent 60%)}
.ghero .emo{position:absolute;right:18px;top:50%;font-size:clamp(90px,16vw,170px);line-height:1;transform:translateY(-50%) rotate(10deg);
  animation:float 6s ease-in-out infinite;filter:drop-shadow(0 20px 30px rgba(0,0,0,.25));opacity:.95}
@keyframes float{50%{transform:translateY(-56%) rotate(4deg)}}
.ghero h1{font-family:var(--fh);font-size:clamp(34px,5.5vw,60px);letter-spacing:-.04em;line-height:1.05;margin:12px 0 6px;max-width:70%}
.ghero h1 .alt{font-size:.42em;letter-spacing:-.01em;margin-top:8px}
.ghero .bd{color:var(--muted);font-size:14px;max-width:65%}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px;max-width:80%}
.fact{padding:11px 13px;border-radius:14px;background:var(--glass2);border:1px solid var(--line)}
.fact span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact b{font-size:14px;font-weight:600;line-height:1.35;display:block;margin-top:2px}
.fact b .alt{font-size:12px}

.glayout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.glayout>*{min-width:0}
.toc{position:sticky;top:132px;padding:14px}
.toc small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:2px 10px 8px}
.toc a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--muted);transition:.2s;cursor:pointer;line-height:1.35}
.toc a em{font-style:normal;font-family:var(--fm);font-size:12px;opacity:.7}
.toc a:hover{color:var(--text);background:var(--chip)}
.toc a.on{color:var(--text);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 3px 0 0 var(--c)}

.tools{display:flex;gap:10px;margin-bottom:14px}
.finput{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px}
.finput input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px;padding:12px 0}
.finput:focus-within{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.pbtn{padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:14px;font-weight:600;white-space:nowrap;transition:.2s;backdrop-filter:blur(10px)}
.pbtn:hover{border-color:var(--c)}

.sec{margin-bottom:14px;overflow:hidden;scroll-margin-top:140px}
.sec .shw{display:flex;align-items:center;gap:4px;padding-right:12px}
.sec .shw .sh{flex:1;min-width:0}
.sec .sh{width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:14px;-webkit-tap-highlight-color:transparent}
.sec .sh:active{background:var(--chip)}
.sec .sb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.sec .sb>div{overflow:hidden;min-height:0}
.sec.open .sb{grid-template-rows:1fr}
.sec .n{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--fm);font-weight:600;font-size:14px;
  background:var(--c);color:#fff;box-shadow:0 8px 18px -8px var(--c)}
.sec .st{flex:1;font-family:var(--fh);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.sec .st .alt{font-family:var(--fb);font-size:13px;letter-spacing:0}
.sec .cnt{font-size:12px;color:var(--muted);white-space:nowrap}

.sec.open .chev{transform:rotate(180deg)}
.rules{list-style:none;margin:0;padding:0 12px 12px}
.rules li{display:grid;grid-template-columns:52px 1fr 36px;gap:6px;padding:13px 10px;border-top:1px solid var(--line);border-radius:12px;scroll-margin-top:160px;transition:background .3s}
.rules li:hover{background:var(--chip)}
.rules .num{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--c);padding-top:3px}
.rules .tx{font-size:15.5px;line-height:1.65}

.rules li.flash{animation:flash 2.6s ease}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--c) 22%,transparent)}100%{background:transparent}}
.hidden{display:none!important}

/* ---------- Read aloud ---------- */
.spk{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid transparent;background:transparent;
  color:var(--muted);opacity:.6;transition:.2s;align-self:start;margin-top:-4px}
.spk svg{width:17px;height:17px}
.rules li:hover .spk,.spk:focus-visible{opacity:1}
.spk:hover{opacity:1;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
@media (hover:none){.spk{opacity:.85}}
.lsn{display:inline-flex;align-items:center;gap:7px;flex:none;height:36px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:600;
  border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:color-mix(in srgb,var(--c) 9%,transparent);color:var(--text);transition:.2s}
.lsn svg{width:16px;height:16px;color:var(--c)}
.lsn:hover{background:color-mix(in srgb,var(--c) 18%,transparent);transform:translateY(-1px)}
.lsn.big{height:44px;padding:0 18px;font-size:14px;margin-top:16px;background:var(--c);color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px var(--c)}
.lsn.big svg{color:#fff}
.lsn.big:hover{background:var(--c);filter:brightness(1.08)}
.rules li.speaking{background:color-mix(in srgb,var(--c) 13%,transparent);box-shadow:inset 3px 0 0 var(--c)}
.spk.on,.spk.eqon,.rules li.speaking .spk{opacity:1;color:#fff;background:var(--c);border-color:transparent}
.spk.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.lsn.on,.sec.speaking-h .lsn.on{background:var(--c);color:#fff;border-color:transparent}
.lsn.on svg{color:#fff}
.sec.speaking-h .lsn{opacity:1}
.sec.speaking-h .lsn svg{color:#fff}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:currentColor;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.dyk .lbl .acts{display:flex;gap:8px;align-items:center}

.player{position:fixed;left:50%;bottom:16px;z-index:70;width:min(620px,calc(100% - 24px));transform:translate(-50%,140%);opacity:0;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;pointer-events:none}
.player.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.player .in{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 10px;border-radius:20px;

.player .pp{width:46px;height:46px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 8px 20px -8px var(--c)}
.player .pp svg{width:20px;height:20px}
.player .meta{flex:1;min-width:0}
.player .meta small{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}

.player .vl button{border:0;background:none;font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;color:var(--muted)}
.player .vl button.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.player .sm{height:32px;min-width:32px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:12px;font-weight:700;display:grid;place-items:center}
.player .sm svg{width:15px;height:15px}
.player .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--c);width:0;transition:width .4s}
body.tts-on footer.wrap{padding-bottom:120px}
@media (max-width:560px){

/* ---------- Command palette ---------- */
.pal{position:fixed;inset:0;z-index:80;display:none;background:rgba(4,5,10,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

.panel{width:min(760px,100%);max-height:78vh;display:flex;flex-direction:column;background:var(--glass2);border:1px solid var(--line);border-radius:22px;

.phead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}

/* ================= DATA ================= */

    ["लाल कार्ड पाए खिलाड़ी की जगह कोई सब्स्टिट्यूट नहीं आ सकता।","A sent-off player cannot be replaced."]]},
  {t:["खेल दोबारा शुरू करना","Restarts"], r:[
    ["थ्रो-इन (Throw-in): गेंद साइड लाइन पार करे तो — दोनों हाथ, सिर के पीछे से ऊपर, दोनों पैर ज़मीन पर। थ्रो-इन से सीधे गोल नहीं।","Throw-in: when the ball crosses the touchline — both hands, from behind and over the head, both feet on the ground. No goal directly from a throw-in."],
    ["गोल किक (Goal Kick): हमलावर टीम की आख़िरी छुई गेंद गोल लाइन के बाहर (गोल के अलावा) जाए।","Goal Kick: when the attacking team last touches the ball before it crosses the goal line without a goal."],
    ["कॉर्नर किक (Corner Kick): डिफ़ेंडिंग टीम की आख़िरी छुई गेंद उनकी गोल लाइन के बाहर जाए। कॉर्नर से सीधे गोल हो सकता है।","Corner Kick: when the defending team last touches the ball before it crosses their goal line. A goal can be scored directly."],
    ["ड्रॉप्ड बॉल (Dropped Ball): चोट या किसी और वजह से खेल रुके तो।","Dropped Ball: used to restart after play stops for an injury or another reason."]]},
  {t:["गोलकीपर और VAR","Goalkeeper & VAR"], r:[

    ["पेनल्टी के समय गोलकीपर का कम से कम एक पैर गोल लाइन पर या उसके ऊपर होना चाहिए।","At a penalty, the goalkeeper must have at least part of one foot on or above the goal line."],
    ["VAR सिर्फ़ 4 मामलों में दख़ल देता है: गोल, पेनल्टी, सीधा लाल कार्ड, और गलत खिलाड़ी को कार्ड (mistaken identity)।","VAR intervenes in only 4 situations: goals, penalties, direct red cards and mistaken identity."],
    ["VAR तभी फ़ैसला बदलवाता है जब गलती साफ़ और स्पष्ट (clear and obvious error) हो।","VAR only overturns a decision for a clear and obvious error."]]}
  ]},

    ["डिफ़ेंडर बिना संघर्ष (struggle) के बाउंड्री से बाहर चला जाए तो आउट।","A defender who steps out of bounds without a struggle is out."],
    ["लॉबी (Lobby): कोर्ट के किनारे की पट्टी — सिर्फ़ रेडर और डिफ़ेंडर के बीच संघर्ष शुरू होने के बाद खेल का हिस्सा बनती है।","Lobby: the side strips come into play only once a struggle has begun between raider and defender."],

    ["फ़ील्ड खिलाड़ी पैर या शरीर से गेंद नहीं रोक सकते; सिर्फ़ गोलकीपर अपने सर्कल में।","Field players can't stop the ball with their feet or body; only the goalkeeper inside their circle."]]},
  {t:["गोल","Scoring a Goal"], r:[
    ["गोल तभी जब हमलावर ने गेंद शूटिंग सर्कल ('D') के अंदर से खेली हो।","A goal counts only if an attacker played the ball inside the shooting circle (the 'D')."],
    ["शूटिंग सर्कल का दायरा गोल से 14.63 मी (16 गज़)।","The shooting circle extends 14.63 m (16 yd) from the goal."],
    ["सर्कल के बाहर से मारा गया शॉट बिना किसी के छुए गोल में चला जाए तो गोल नहीं।","A shot from outside the circle that goes in untouched is not a goal."]]},
  {t:["पेनल्टी कॉर्नर","Penalty Corner"], r:[
    ["कब मिलता है: डिफ़ेंस सर्कल के अंदर फ़ाउल करे, अपने 23 मी क्षेत्र में जानबूझकर फ़ाउल करे, या जानबूझकर गेंद अपनी बैकलाइन के बाहर भेजे।","Awarded when: the defence fouls inside the circle, fouls deliberately in its own 23 m area, or deliberately plays the ball over its own back line."],
    ["गेंद बैकलाइन पर गोल पोस्ट से कम से कम 10 मी दूर से पुश की जाती है।","The ball is pushed from the back line at least 10 m from the goalpost."],
    ["डिफ़ेंस: 5 खिलाड़ी (गोलकीपर सहित) गोल लाइन के पीछे, बाकी सेंटर लाइन पर।","Defence: 5 players (including the GK) behind the goal line, the rest at the centre line."],
    ["शॉट लेने से पहले गेंद सर्कल के बाहर जानी ज़रूरी।","The ball must travel outside the circle before a shot can be taken."],
    ["पहला शॉट हिट हो तो गेंद गोल लाइन पर 460 मिमी (बैकबोर्ड) से नीचे होनी चाहिए; ड्रैग फ़्लिक ऊँची जा सकती है।","If the first shot is a hit, it must cross the goal line below 460 mm (backboard height); a drag flick may go higher."]]},
  {t:["पेनल्टी स्ट्रोक और शूटआउट","Penalty Stroke & Shootout"], r:[
    ["पेनल्टी स्ट्रोक: फ़ाउल से संभावित गोल रोका गया हो — गोल से 6.4 मी दूर स्पॉट से, सिर्फ़ गोलकीपर के सामने।","Penalty Stroke: awarded when a foul prevents a probable goal — taken from a spot 6.4 m from goal, one-on-one with the keeper."],
    ["शूटआउट: ड्रॉ के बाद नतीजा ज़रूरी हो तो 5-5 खिलाड़ी, 23 मी लाइन से शुरू, गोल करने के लिए 8 सेकंड।","Shootout: when a result is needed after a draw, 5 players each start from the 23 m line and have 8 seconds to score."]]},
  {t:["फ़ाउल और फ़्री हिट","Fouls & Free Hits"], r:[
    ["ऑब्स्ट्रक्शन (Obstruction): शरीर या स्टिक से विरोधी को गेंद तक पहुँचने से रोकना।","Obstruction: using body or stick to block an opponent from reaching the ball."],
    ["खतरनाक खेल: उठी हुई गेंद (raised ball) जो किसी को खतरे में डाले, या खतरनाक टैकल/स्टिक।","Dangerous play: a raised ball that endangers someone, or dangerous tackles or stick use."],
    ["फ़्री हिट पर विरोधी कम से कम 5 मी दूर रहें।","Opponents must be at least 5 m away at a free hit."],
    ["सेल्फ़-पास (Self-pass): फ़्री हिट लेने वाला खिलाड़ी खुद ही गेंद लेकर आगे बढ़ सकता है।","Self-pass: the player taking a free hit can carry on with the ball themselves."],
    ["अटैकिंग 23 मी क्षेत्र में फ़्री हिट पर गेंद सर्कल में जाने से पहले कम से कम 5 मी चलनी चाहिए या किसी डिफ़ेंडर से छूनी चाहिए।","From a free hit in the attacking 23 m area, the ball must travel 5 m or touch a defender before entering the circle."]]},
  {t:["कार्ड और वीडियो रेफ़रल","Cards & Video Referral"], r:[
    ["ग्रीन कार्ड: 2 मिनट निलंबन।","Green card: 2-minute suspension."],
    ["येलो कार्ड: कम से कम 5 मिनट निलंबन, गंभीरता के हिसाब से ज़्यादा।","Yellow card: suspension of at least 5 minutes, longer depending on severity."],
    ["रेड कार्ड: पूरे मैच से बाहर।","Red card: out for the rest of the match."],
    ["निलंबन के दौरान टीम एक खिलाड़ी कम के साथ खेलती है।","While a player is suspended, the team plays one short."],
    ["वीडियो रेफ़रल: टीम फ़ैसले पर रिव्यू ले सकती है; सही निकला तो बचा रहता है, गलत तो ख़त्म।","Video referral: a team can challenge a decision; it keeps the referral if successful and loses it if not."]]}
  ]},

{ id:"khokho", name:["खो-खो","Kho-Kho"], icon:"🏃", c:"#ca8a04",
  body:["KKFI · Kho Kho Federation of India","KKFI · Kho Kho Federation of India"],
  facts:[[["खिलाड़ी","Players"],["12 स्क्वाड · 9 मैदान पर","12 squad · 9 on field"]],[["समय","Duration"],["2 पारी · 9-9 मिनट","2 innings · 9-min turns"]],[["मैदान","Field"],["27 × 16 मी","27 × 16 m"]],[["खंभे","Poles"],["दोनों छोर पर 1-1","1 at each end"]]],
  sections:[
  {t:["बुनियादी नियम","Basics"], r:[
    ["हर टीम में 12 खिलाड़ी; 9 मैदान में उतरते हैं। एक टीम पीछा (chase) करती है, दूसरी बचाव (defend)।","Each team has 12 players; 9 take the field. One team chases while the other defends."],
    ["चेज़िंग टीम के 8 खिलाड़ी बीच की लेन के खानों में बारी-बारी उल्टी दिशाओं में मुँह करके बैठते हैं; 9वाँ सक्रिय चेज़र (active chaser) होता है।","8 chasers sit in the squares of the central lane, facing alternate directions; the 9th is the active chaser."],
    ["मैच में 2 पारियाँ होती हैं; हर पारी में दोनों टीमें 9-9 मिनट पीछा और 9-9 मिनट बचाव करती हैं।","A match has 2 innings; in each innings both teams chase for 9 minutes and defend for 9 minutes."],
    ["डिफ़ेंडर 3-3 के बैच में मैदान में आते हैं; तीनों आउट होते ही अगला बैच तुरंत अंदर आना चाहिए।","Defenders enter in batches of 3; as soon as all three are out, the next batch must come in."],
    ["मैदान 27 मी × 16 मी, बीच में लंबी लेन और दोनों छोर पर एक-एक खंभा (pole)।","The field is 27 m × 16 m, with a central lane and a pole at each end."],
    ["आख़िर में जिस टीम के ज़्यादा पॉइंट हों, वो जीतती है।","The team with more points at the end wins."]]},
  {t:["पीछा करना","Chasing"], r:[
    ["सक्रिय चेज़र हथेली से डिफ़ेंडर को छूकर आउट करता है; हर आउट पर चेज़िंग टीम को पॉइंट मिलता है।","The active chaser puts a defender out by touching them with the palm; every out earns the chasing team a point."],
    ["खो (Kho): सक्रिय चेज़र बैठे साथी को पीछे से छूकर ज़ोर से 'खो' बोलता है; वो साथी नया सक्रिय चेज़र बन जाता है।","Kho: the active chaser touches a seated teammate from behind and says 'Kho' loudly; that teammate becomes the new active chaser."],
    ["सक्रिय चेज़र बीच की लेन पार नहीं कर सकता; दूसरी तरफ़ जाने के लिए उसे छोर वाले खंभे का चक्कर लगाना होता है।","The active chaser can't cross the central lane; to switch sides they must go round the pole at the end."],
    ["एक खंभे की दिशा में चल पड़ा चेज़र बीच में पलटकर उल्टी दिशा में नहीं जा सकता।","Once a chaser starts towards one pole, they can't turn back the other way midway."],
    ["बैठा चेज़र सही 'खो' मिलने से पहले उठ नहीं सकता; जल्दी उठना फ़ाउल है।","A seated chaser can't get up before receiving a proper kho; rising early is a foul."],
    ["फ़ाउल होने पर अंपायर चेज़र को दिशा बदलने या खो देने को कहता है, और उस दौरान हुआ आउट नहीं गिना जाता।","On a foul the umpire makes the chaser reverse or give a kho, and an out made through the foul doesn't count."]]},
  {t:["बचाव","Defending"], r:[
    ["डिफ़ेंडर आउट होता है: सक्रिय चेज़र के छूने पर, बाउंड्री से बाहर पैर पड़ने पर, या बैच में देर से आने पर।","A defender is out when touched by the active chaser, on stepping outside the boundary, or on entering late with their batch."],
    ["डिफ़ेंडर पूरे मैदान में कहीं भी दौड़ सकते हैं और बीच की लेन भी पार कर सकते हैं।","Defenders may run anywhere on the field, including across the central lane."],
    ["अच्छे डिफ़ेंडर 'चेन' और 'रिंग' जैसी दौड़ से चेज़र को चकमा देकर ज़्यादा देर टिकते हैं।","Good defenders use patterns like the chain and ring runs to dodge chasers and survive longer."]]},
  {t:["टाई और लीग नियम","Ties & League Rules"], r:[
    ["मैच टाई होने पर दोनों टीमों को एक-एक अतिरिक्त पारी मिलती है।","If a match is tied, each team gets one extra innings."],
    ["Ultimate Kho Kho (UKK) लीग में 7-7 मिनट की बारी, 'वज़ीर' (जो दोनों दिशाओं में दौड़ सकता है) और 'ड्रीम रन' (टिके रहने पर डिफ़ेंस को बोनस पॉइंट) जैसे नियम हैं।","The Ultimate Kho Kho (UKK) league uses 7-minute turns, a 'Wazir' (a chaser who may run in either direction) and the 'Dream Run' (bonus points for defenders who survive)."]]}
  ]},

{ id:"chess", name:["शतरंज","Chess"], icon:"♟️", c:"#475569",
  body:["FIDE · AICF (All India Chess Federation)","FIDE · AICF (All India Chess Federation)"],
  facts:[[["खिलाड़ी","Players"],["2","2"]],[["बोर्ड","Board"],["8 × 8 (64 खाने)","8 × 8 (64 squares)"]],[["मोहरे","Pieces"],["16 प्रति खिलाड़ी","16 per player"]],[["लक्ष्य","Goal"],["चेकमेट","Checkmate"]]],
  sections:[
  {t:["बुनियादी नियम","Basics"], r:[
    ["सफ़ेद (White) पहले चलता है; फिर दोनों बारी-बारी एक-एक चाल चलते हैं।","White moves first; then the players alternate, one move each."],
    ["बोर्ड ऐसे रखा जाता है कि हर खिलाड़ी के दाएँ कोने में सफ़ेद खाना हो।","The board is placed so each player has a light square in the right-hand corner."],
    ["हर पक्ष: 1 राजा, 1 वज़ीर, 2 हाथी, 2 ऊँट, 2 घोड़े, 8 प्यादे। वज़ीर अपने रंग के खाने पर शुरू करता है।","Each side has 1 king, 1 queen, 2 rooks, 2 bishops, 2 knights and 8 pawns. The queen starts on her own colour."],
    ["लक्ष्य: विरोधी के राजा को चेकमेट करना।","The goal is to checkmate the opponent's king."]]},
  {t:["मोहरों की चाल","How Pieces Move"], r:[
    ["राजा (King): किसी भी दिशा में 1 खाना; वो कभी ऐसे खाने पर नहीं जा सकता जहाँ उस पर हमला हो।","King: one square in any direction; it may never move into check."],
    ["वज़ीर (Queen): सीधी या तिरछी लाइन में जितने चाहे उतने खाने।","Queen: any number of squares in a straight line or diagonal."],
    ["हाथी (Rook): सीधा आगे-पीछे या दाएँ-बाएँ; ऊँट (Bishop): सिर्फ़ तिरछा।","Rook: any distance along ranks and files. Bishop: any distance diagonally."],
    ["घोड़ा (Knight): ढाई घर (L आकार — 2 एक तरफ़, 1 मुड़कर); ये बीच के मोहरों के ऊपर से कूद सकता है।","Knight: moves in an L shape (2 one way, 1 sideways) and can jump over other pieces."],
    ["प्यादा (Pawn): एक खाना आगे; पहली चाल में दो खाने तक। मारता (capture) तिरछा एक खाना आगे।","Pawn: moves one square forward, or two on its first move; it captures one square diagonally forward."]]},
  {t:["ख़ास चालें","Special Moves"], r:[
    ["कैसलिंग (Castling): राजा हाथी की तरफ़ 2 खाने चलता है और हाथी उसके ऊपर से दूसरी तरफ़ आ जाता है।","Castling: the king moves two squares towards a rook, and the rook hops over to the other side of the king."],
    ["कैसलिंग नहीं हो सकती अगर राजा या वो हाथी पहले चल चुका हो, राजा चेक में हो, बीच के खाने पर हमला हो, या बीच में कोई मोहरा हो।","No castling if the king or that rook has moved, the king is in check, it passes through or lands on an attacked square, or pieces stand between."],
    ["आँ पासाँ (En passant): विरोधी का प्यादा 2 खाने चलकर आपके प्यादे के बगल में आए, तो अगली ही चाल में आप उसे ऐसे मार सकते हैं जैसे वो 1 खाना चला हो।","En passant: if an enemy pawn moves two squares and lands beside your pawn, you may capture it as if it had moved one — only on the very next move."],
    ["प्रमोशन (Promotion): आख़िरी पंक्ति तक पहुँचा प्यादा वज़ीर, हाथी, ऊँट या घोड़ा बनना ही चाहिए।","Promotion: a pawn reaching the last rank must become a queen, rook, bishop or knight."]]},
  {t:["चेक, मात और ड्रॉ","Check, Mate & Draws"], r:[
    ["चेक (Check): राजा पर हमला; उसे तुरंत बचाना ज़रूरी — राजा हटाकर, बीच में मोहरा लगाकर, या हमलावर को मारकर।","Check: the king is attacked and must be saved at once — by moving it, blocking, or capturing the attacker."],
    ["चेकमेट (Checkmate): राजा चेक में है और बचने की कोई वैध चाल नहीं — खेल ख़त्म, हमलावर जीता।","Checkmate: the king is in check with no legal escape — the game ends and the attacker wins."],
    ["स्टेलमेट (Stalemate): चाल चलने वाले के पास कोई वैध चाल नहीं, पर राजा चेक में नहीं — खेल ड्रॉ।","Stalemate: the side to move has no legal move but isn't in check — the game is drawn."],
    ["दूसरे ड्रॉ: आपसी सहमति, एक ही स्थिति 3 बार दोहराना, 50 चालों तक न कोई मोहरा मरे न प्यादा चले, या मात देने लायक मोहरे ही न बचें (जैसे सिर्फ़ दोनों राजा)।","Other draws: agreement, threefold repetition, the 50-move rule (no capture or pawn move in 50 moves each), or insufficient material such as king vs king."],
    ["कोई भी खिलाड़ी हार मानकर (resign) खेल ख़त्म कर सकता है।","Either player may resign to end the game."]]},
  {t:["टूर्नामेंट नियम","Tournament Rules"], r:[
    ["टच-मूव (Touch-move): अपना मोहरा जानबूझकर छुआ तो उसी को चलना होगा; विरोधी का छुआ तो (अगर संभव हो) उसे मारना होगा। सिर्फ़ ठीक करने से पहले 'J'adoube' या 'adjust' बोलें।","Touch-move: deliberately touch your own piece and you must move it; touch an opponent's piece and you must capture it if legal. Say 'J'adoube' or 'adjust' first if you only want to straighten it."],
    ["चेस क्लॉक: चाल उसी हाथ से चलें जिससे घड़ी दबाते हैं। समय ख़त्म = हार, सिवाय तब जब विरोधी किसी भी तरह मात न दे सके — तब ड्रॉ।","Chess clock: press the clock with the hand you moved with. Running out of time loses — unless the opponent cannot possibly checkmate, which makes it a draw."],
    ["गलत (illegal) चाल पर पहली बार विरोधी को अतिरिक्त समय मिलता है; दूसरी गलत चाल पर हार।","After a first illegal move the opponent gets extra time; a second illegal move loses the game."],
    ["खेल के दौरान मोबाइल फ़ोन की आवाज़ आए तो खिलाड़ी हार जाता है (FIDE)।","If a player's mobile phone makes a sound in the playing area, that player loses (FIDE)."]]}
  ]},

{ id:"tabletennis", name:["टेबल टेनिस","Table Tennis"], icon:"🏓", c:"#7c3aed",
  body:["ITTF · WTT","ITTF · WTT"],
  facts:[[["स्कोरिंग","Scoring"],["11 पॉइंट · बेस्ट ऑफ़ 5/7","11 pts · best of 5/7"]],[["टेबल","Table"],["2.74 × 1.525 मी","2.74 × 1.525 m"]],[["नेट","Net"],["15.25 सेमी","15.25 cm"]],[["बॉल","Ball"],["40 मिमी","40 mm"]]],
  sections:[
  {t:["स्कोरिंग","Scoring"], r:[
    ["हर रैली पर पॉइंट; एक गेम 11 पॉइंट का।","A point is scored on every rally; a game is played to 11."],
    ["10-10 होने पर 2 पॉइंट की बढ़त ज़रूरी।","At 10-10 a 2-point lead is needed."],
    ["मैच आमतौर पर बेस्ट ऑफ़ 5 या बेस्ट ऑफ़ 7 गेम का होता है।","Matches are usually best of 5 or best of 7 games."]]},
  {t:["सर्विस","Service"], r:[
    ["बॉल खुली, सपाट हथेली पर रखें, कम से कम 16 सेमी लगभग सीधा ऊपर उछालें, और नीचे आते समय मारें।","Rest the ball on an open, flat palm, toss it almost vertically at least 16 cm, and strike it as it falls."],
    ["सर्विस के समय बॉल टेबल की सतह से ऊपर और एंड लाइन के पीछे हो, और रिसीवर को साफ़ दिखे — शरीर या हाथ से छिपाना मना।","During the serve the ball must be above the table and behind the end line, and visible to the receiver — no hiding it with body or arm."],
    ["सर्विस पहले अपनी तरफ़ एक बार टप्पा खाए, फिर नेट पार करके सामने एक बार।","The serve must bounce once on the server's side, then once on the receiver's side."],
    ["हर खिलाड़ी लगातार 2 सर्विस करता है; 10-10 के बाद हर पॉइंट पर सर्विस बदलती है।","Each player serves 2 points in a row; from 10-10 the serve alternates every point."],
    ["सर्विस नेट छूकर सही जगह गिरे तो लेट (Let) — सर्विस दोबारा।","A serve that touches the net and lands correctly is a let and is replayed."],
    ["डबल्स में सर्विस अपने दाएँ आधे हिस्से से सामने वाले के दाएँ आधे हिस्से में (तिरछी)।","In doubles the serve goes from the server's right half to the receiver's right half, diagonally."]]},
  {t:["रैली","The Rally"], r:[
    ["सर्विस के बाद बॉल को नेट के ऊपर या बगल से सीधे विरोधी की तरफ़ टेबल पर गिराना होता है।","After the serve, the ball must be returned over or around the net to land directly on the opponent's side."],
    ["अपनी तरफ़ बॉल का एक बार टप्पा खाना ज़रूरी; टेबल के ऊपर से बिना टप्पे के मारना (volley) पॉइंट गँवाना है।","The ball must bounce once on your side; hitting it before it bounces over the table loses the point."],
    ["टेबल का ऊपरी किनारा (edge) छूकर बॉल अंदर है; साइड वाला हिस्सा छूकर नहीं।","A ball clipping the top edge of the table is good; one hitting the side face is not."],
    ["पॉइंट गँवाते हैं: खाली हाथ से टेबल छूना, टेबल हिलाना, नेट छूना, बॉल शरीर से लगना।","You lose the point for touching the table with your free hand, moving the table, touching the net, or being hit by the ball."],
    ["डबल्स में दोनों पार्टनर बारी-बारी से ही बॉल मारते हैं।","In doubles, partners must hit the ball alternately."]]},
  {t:["दूसरे नियम","Other Rules"], r:[
    ["हर गेम के बाद साइड बदलती है; आख़िरी गेम में किसी के 5 पॉइंट होने पर भी।","Players change ends after each game, and in the deciding game when someone reaches 5 points."],
    ["एक्सपीडाइट सिस्टम: कोई गेम 10 मिनट चले (जब तक दोनों के 9+ पॉइंट न हों) तो सर्वर को 13 रिटर्न के अंदर पॉइंट जीतना होता है, वरना पॉइंट रिसीवर का।","Expedite system: if a game lasts 10 minutes (unless both players have 9+ points), the server must win the point within 13 returns or it goes to the receiver."],
    ["रैकेट की एक तरफ़ काली रबर और दूसरी तरफ़ किसी अलग चमकीले रंग (जैसे लाल) की होनी चाहिए।","The racket must have black rubber on one side and a bright, clearly different colour (such as red) on the other."],
    ["गेम के बीच 1 मिनट का ब्रेक; हर खिलाड़ी/टीम मैच में एक बार 1 मिनट का टाइम-आउट ले सकती है।","There is a 1-minute break between games; each player or pair may take one 1-minute time-out per match."]]}
  ]},

{ id:"volleyball", name:["वॉलीबॉल","Volleyball"], icon:"🏐", c:"#db2777",
  body:["FIVB · Volleyball Federation of India","FIVB · Volleyball Federation of India"],
  facts:[[["खिलाड़ी","Players"],["6 प्रति टीम","6 per side"]],[["स्कोरिंग","Scoring"],["25 पॉइंट · बेस्ट ऑफ़ 5","25 pts · best of 5"]],[["नेट","Net"],["2.43 मी पुरुष · 2.24 मी महिला","2.43 m men · 2.24 m women"]],[["कोर्ट","Court"],["18 × 9 मी","18 × 9 m"]]],
  sections:[
  {t:["बुनियादी नियम और स्कोरिंग","Basics & Scoring"], r:[
    ["हर टीम के 6 खिलाड़ी कोर्ट पर; हर रैली पर पॉइंट (rally point)।","6 players per side on court; every rally scores a point."],
    ["सेट 25 पॉइंट का, 2 पॉइंट की बढ़त ज़रूरी। मैच बेस्ट ऑफ़ 5 सेट; निर्णायक 5वाँ सेट 15 पॉइंट का।","Sets are played to 25 with a 2-point lead. Matches are best of 5 sets; the deciding 5th set is played to 15."],
    ["एक टीम बॉल लौटाने से पहले अधिकतम 3 बार छू सकती है (ब्लॉक का छूना नहीं गिना जाता)।","A team may touch the ball at most 3 times before returning it (a block touch doesn't count)."],
    ["एक खिलाड़ी लगातार दो बार बॉल नहीं छू सकता (ब्लॉक के बाद छोड़कर)।","A player can't touch the ball twice in a row (except after a block)."]]},
  {t:["सर्विस और रोटेशन","Serve & Rotation"], r:[
    ["सर्वर एंड लाइन के पीछे से, रेफ़री की सीटी के 8 सेकंड के अंदर सर्विस करता है।","The server serves from behind the end line within 8 seconds of the referee's whistle."],
    ["रिसीव करने वाली टीम रैली जीते तो सर्विस उसे मिलती है और उसके खिलाड़ी एक पोज़िशन घड़ी की दिशा (clockwise) में घूमते हैं।","When the receiving team wins the rally, it gains the serve and its players rotate one position clockwise."],
    ["सर्विस के समय खिलाड़ी सही रोटेशन क्रम में न हों तो पोज़िशन फ़ॉल्ट।","Players out of rotational order at the moment of service commit a position fault."],
    ["सर्विस नेट छूकर पार चली जाए तो खेल जारी रहता है।","A serve that touches the net and goes over stays in play."]]},
  {t:["फ़ॉल्ट","Faults"], r:[
    ["बॉल बाहर गिरे, एंटीना से लगे, या एंटीना के बाहर से पार हो।","The ball lands out, hits an antenna, or crosses outside the antennae."],
    ["रैली के दौरान एंटीना के बीच नेट छूना फ़ॉल्ट है।","Touching the net between the antennae during a rally is a fault."],
    ["पूरा पैर सेंटर लाइन पार करके विरोधी कोर्ट में जाना फ़ॉल्ट; पैर का कुछ हिस्सा लाइन पर/ऊपर हो तो ठीक।","A whole foot crossing the centre line into the opponent's court is a fault; part of the foot on or above the line is fine."],
    ["बॉल पकड़ना या फेंकना (lift / held ball) फ़ॉल्ट है — बॉल साफ़ मारनी होती है।","Catching or throwing the ball (a lift or held ball) is a fault — it must be cleanly hit."],
    ["बैक-रो खिलाड़ी अटैक लाइन (3 मी) के आगे से नेट की ऊँचाई के ऊपर अटैक या ब्लॉक नहीं कर सकते।","Back-row players can't attack the ball above net height from in front of the 3 m attack line, and can't block."]]},
  {t:["लिबेरो, सब्स्टिट्यूशन और टाइम-आउट","Libero, Subs & Time-outs"], r:[
    ["लिबेरो (Libero) अलग रंग की जर्सी पहनता है और सिर्फ़ बैक-रो डिफ़ेंस खेलता है।","The libero wears a different-coloured jersey and plays only as a back-row defender."],
    ["इंटरनेशनल नियमों में लिबेरो सर्विस, ब्लॉक या नेट से ऊपर अटैक नहीं कर सकता।","Under international rules the libero can't serve, block, or attack the ball above net height."],
    ["लिबेरो की अदला-बदली असीमित है और सामान्य सब्स्टिट्यूशन में नहीं गिनी जाती।","Libero replacements are unlimited and don't count as substitutions."],
    ["हर टीम प्रति सेट 6 सब्स्टिट्यूशन कर सकती है।","Each team may make 6 substitutions per set."],
    ["हर टीम प्रति सेट 2 टाइम-आउट ले सकती है, हर एक 30 सेकंड का।","Each team gets 2 time-outs per set, of 30 seconds each."]]}
  ]},

{ id:"basketball", name:["बास्केटबॉल","Basketball"], icon:"🏀", c:"#dc2626",
  body:["FIBA · Basketball Federation of India","FIBA · Basketball Federation of India"],
  facts:[[["खिलाड़ी","Players"],["5 कोर्ट पर · 12 स्क्वाड","5 on court · 12 squad"]],[["समय","Duration"],["4×10 मिनट (FIBA)","4×10 min (FIBA)"]],[["रिंग","Hoop"],["3.05 मी ऊँचा","3.05 m high"]],[["शॉट क्लॉक","Shot clock"],["24 सेकंड","24 sec"]]],
  sections:[
  {t:["स्कोरिंग","Scoring"], r:[
    ["3-पॉइंट लाइन के अंदर से बास्केट = 2 पॉइंट; लाइन के बाहर से = 3 पॉइंट (FIBA में लाइन 6.75 मी पर)।","A basket from inside the 3-point line = 2 points; from beyond it = 3 points (the line is 6.75 m away in FIBA)."],
    ["फ़्री थ्रो (Free Throw) = 1 पॉइंट।","A free throw is worth 1 point."],
    ["FIBA में 10-10 मिनट के 4 क्वार्टर (NBA में 12-12 मिनट)। बराबरी पर 5 मिनट का ओवरटाइम, नतीजा आने तक।","FIBA plays 4 quarters of 10 minutes (the NBA uses 12). A tie goes to 5-minute overtimes until there's a winner."]]},
  {t:["बॉल के साथ चलना","Moving With the Ball"], r:[
    ["बॉल लेकर चलने के लिए ड्रिबल (उछालते रहना) ज़रूरी।","You must dribble to move with the ball."],
    ["ट्रैवलिंग (Travelling): बिना ड्रिबल किए बॉल लेकर 2 से ज़्यादा कदम चलना।","Travelling: taking more than 2 steps while holding the ball without dribbling."],
    ["डबल ड्रिबल: ड्रिबल रोककर बॉल पकड़ने के बाद फिर ड्रिबल करना, या दोनों हाथों से एक साथ ड्रिबल करना।","Double dribble: dribbling again after stopping and holding the ball, or dribbling with both hands at once."],
    ["बैककोर्ट वायलेशन: बॉल एक बार विरोधी हाफ़ (frontcourt) में चली जाए तो उसे वापस अपने हाफ़ में नहीं ले जा सकते।","Backcourt violation: once the ball is in the frontcourt, the team can't take it back into its own half."]]},
  {t:["समय के नियम","Time Rules"], r:[
    ["24 सेकंड शॉट क्लॉक: इतने समय में शॉट लेना ज़रूरी; ऑफ़ेंसिव रिबाउंड जैसे मामलों में घड़ी 14 सेकंड पर रीसेट होती है।","24-second shot clock: a shot must be taken in that time; after an offensive rebound and similar cases it resets to 14."],
    ["8 सेकंड नियम: बॉल को 8 सेकंड में अपने हाफ़ से आगे ले जाना होता है।","8-second rule: the team must get the ball out of its own half within 8 seconds."],
    ["3 सेकंड नियम: हमलावर खिलाड़ी विरोधी की बास्केट के नीचे वाले पेंट (restricted area) में 3 सेकंड से ज़्यादा नहीं रुक सकता।","3-second rule: an attacking player can't stay in the opponent's restricted area (the paint) for more than 3 seconds."],
    ["5 सेकंड नियम: कसकर घिरा खिलाड़ी 5 सेकंड में पास, शॉट या ड्रिबल करे; थ्रो-इन भी 5 सेकंड में।","5-second rule: a closely guarded player must pass, shoot or dribble within 5 seconds; throw-ins must also be made within 5 seconds."]]},
  {t:["फ़ाउल","Fouls"], r:[
    ["पर्सनल फ़ाउल: धक्का, पकड़ना, गलत तरीके से रास्ता रोकना (blocking) या टकराना (charging)।","Personal foul: illegal contact such as pushing, holding, blocking or charging."],
    ["शूटिंग फ़ाउल पर 2 या 3 फ़्री थ्रो; फ़ाउल के बावजूद बास्केट हो जाए तो वो गिनी जाती है और 1 फ़्री थ्रो और (and-one)।","A shooting foul earns 2 or 3 free throws; if the basket still goes in, it counts plus 1 free throw (the 'and-one')."],
    ["FIBA में 5 पर्सनल फ़ाउल (NBA में 6) पर खिलाड़ी बाहर (foul out)।","A player fouls out after 5 personal fouls in FIBA (6 in the NBA)."],
    ["टीम फ़ाउल: एक क्वार्टर में टीम के 5वें फ़ाउल से, हर डिफ़ेंसिव फ़ाउल पर विरोधी को 2 फ़्री थ्रो।","Team fouls: from a team's 5th foul in a quarter, every defensive foul gives the opponents 2 free throws."],
    ["गोलटेंडिंग: नीचे आती हुई बॉल को बास्केट की तरफ़ जाते समय रोकना — बास्केट गिनी जाती है।","Goaltending: blocking the ball on its downward flight towards the basket — the basket is awarded."]]}
  ]},

{ id:"tennis", name:["टेनिस","Tennis"], icon:"🎾", c:"#65a30d",

  facts:[[["स्कोरिंग","Scoring"],["0 · 15 · 30 · 40 · गेम","0 · 15 · 30 · 40 · Game"]],[["सेट","Sets"],["बेस्ट ऑफ़ 3 या 5","Best of 3 or 5"]],[["कोर्ट","Court"],["23.77 × 8.23 मी (सिंगल्स)","23.77 × 8.23 m (singles)"]],[["नेट","Net"],["0.914 मी (बीच में)","0.914 m (centre)"]]],
  sections:[
  {t:["स्कोरिंग","Scoring"], r:[
